<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4 Waterproofing Order Sheet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-yellow: #ffde00;
            --text-dark: #333;
            --error-red: #ff3333;
            --confirm-blue: #007bff;
            --cancel-grey: #6c757d;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* --- Language Toggle & Header --- */
        .lang-switch {
            background: #333;
            padding: 10px;
            text-align: right;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .lang-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 5px 15px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 5px;
        }

        .lang-btn.active {
            background: var(--primary-yellow);
            color: black;
            border-color: var(--primary-yellow);
            font-weight: bold;
        }

        header {
            background-color: var(--primary-yellow);
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
            background: black;
            color: var(--primary-yellow);
            padding: 8px 12px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Text Content Section --- */
        .content-section {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary-yellow);
        }

        .main-headline {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f; /* Red tone for attention */
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .sub-headline {
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #000;
        }

        .text-block {
            margin-bottom: 15px;
            text-align: justify;
        }

        .highlight-box {
            background: #fffbe6;
            border-left: 5px solid var(--primary-yellow);
            padding: 15px;
            margin: 20px 0;
        }

        /* --- 3x3 Image Grid Section --- */
        .grid-section h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Columns fixed */
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            text-align: center;
            height: 220px; /* Fixed Height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-yellow);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card i {
            font-size: 50px;
            color: #555;
            margin-bottom: 20px;
        }

        .card p {
            font-weight: bold;
            font-size: 15px;
            margin: 0;
        }

        /* --- Order Sheet (Form) --- */
        .order-sheet {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-yellow);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }

        /* Error Style */
        .form-input.error, .form-select.error {
            border: 2px solid var(--error-red);
            background-color: #ffe6e6;
        }

        .error-msg {
            color: var(--error-red);
            font-size: 12px;
            display: none;
        }

        .copy-btn {
            background: #eee;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            border-radius: 4px;
        }

        /* --- Bottom Buttons --- */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-confirm { background-color: var(--confirm-blue); }
        .btn-cancel { background-color: var(--cancel-grey); }
        .btn-share { background-color: #25D366; display: none; margin-top: 15px; width: 100%; } /* WhatsApp Green */

        /* Responsive for Mobile */
        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: 1fr; /* Stack on mobile */
            }
            .main-headline {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="lang-switch">

                <div class="card"><i class="fas fa-industry"></i><p id="c6">Anti-Corrosion</p></div>
                <div class="card"><i class="fas fa-home"></i><p id="c7">Roofs & Terraces</p></div>
                <div class="card"><i class="fas fa-layer-group"></i><p id="c8">Wall Protection</p></div>
                <div class="card"><i class="fas fa-water"></i><p id="c9">Water Tanks</p></div>
            </div>
        </div>

        <div class="order-sheet">
            <h2 id="formTitle" style="text-align:center; margin-bottom:20px;">Order Sheet</h2>

            <div class="form-group">
                <label class="form-label" id="lblName">Name</label>
                <input type="text" id="name" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" id="lblAddress">Address</label>
                <textarea id="address" class="form-input" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" id="lblArea">Area</label>
                <input type="text" id="area" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" id="lblStreet">Street</label>
                <input type="text" id="street" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" id="lblMobile">Mobile (10 Digit)</label>
                <input type="number" id="mobile" class="form-input" placeholder="99xxxxxxxx" oninput="checkMobile()">
                <small class="error-msg">Must be 10 digits</small>
            </div>

            <div class="form-group">
                <label class="form-label" id="lblWhatsapp">WhatsApp (Optional)</label>
                <input type="number" id="whatsapp" class="form-input" placeholder="99xxxxxxxx">
                <button type="button" class="copy-btn" onclick="copyMobileToWa()" id="btnCopyWa">Use Mobile Number</button>
                <small class="error-msg">Must be 10 digits</small>
            </div>

            <div class="form-group">
                <label class="form-label" id="lblPincode">Pin Code (6 Digit)</label>
                <input type="number" id="pincode" class="form-input" placeholder="67xxxx">
                <small class="error-msg">Must be 6 digits</small>
            </div>

            <div class="form-group">
                <label class="form-label" id="lblDistrict">District</label>
                <input type="text" id="district" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" id="lblState">State</label>
                <input type="text" id="state" class="form-input" value="Kerala">
            </div>

            <div class="form-group">
                <label class="form-label" id="lblSelectArea">Area for Waterproofing</label>
                <select id="waterproofArea" class="form-select">
                    <option value="">-- Select --</option>
                    <option value="Home">Home</option>
                    <option value="Office">Office</option>
                    <option value="Shop">Shop</option>
                    <option value="Building">Building</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" id="lblQuantity">Quantity</label>
                <input type="number" id="quantity" class="form-input" min="1" max="1000000">
            </div>

            <div class="action-buttons">
                <button class="btn btn-cancel" onclick="resetForm()" id="btnCancel">Cancel</button>
                <button class="btn btn-confirm" onclick="validateAndSend()" id="btnConfirm">Confirm</button>
            </div>
            
            <button class="btn btn-share" id="btnShare" onclick="shareDetails()">Share Details <i class="fas fa-share-alt"></i></button>
        </div>

    </div>

        function copyMobileToWa() {
            const mobile = document.getElementById('mobile').value;
            if(mobile) {
                document.getElementById('whatsapp').value = mobile;
            } else {
                alert("Please enter mobile number first / ദയവായി മൊബൈൽ നമ്പർ നൽകുക");
            }
        }

        function validateAndSend() {
            // Get Values
            const name = document.getElementById('name');
            const address = document.getElementById('address');
            const area = document.getElementById('area');
            const street = document.getElementById('street');
            const mobile = document.getElementById('mobile');
            const whatsapp = document.getElementById('whatsapp');
            const pincode = document.getElementById('pincode');
            const district = document.getElementById('district');
            const state = document.getElementById('state');
            const wpArea = document.getElementById('waterproofArea');
            const qty = document.getElementById('quantity');

            let isValid = true;
            
            // Clear previous errors
            document.querySelectorAll('.form-input, .form-select').forEach(el => el.classList.remove('error'));

            // Validation Logic
            if(!name.value) { name.classList.add('error'); isValid = false; }
            if(!address.value) { address.classList.add('error'); isValid = false; }
            if(!area.value) { area.classList.add('error'); isValid = false; }
            if(!street.value) { street.classList.add('error'); isValid = false; }
            if(!district.value) { district.classList.add('error'); isValid = false; }
            if(!wpArea.value) { wpArea.classList.add('error'); isValid = false; }
            if(!qty.value) { qty.classList.add('error'); isValid = false; }

            // Mobile Validation (10 digits)
            if(mobile.value.length !== 10) { mobile.classList.add('error'); isValid = false; }
            // Pincode Validation (6 digits)
            if(pincode.value.length !== 6) { pincode.classList.add('error'); isValid = false; }
            // WhatsApp (if filled, must be 10 digits)
            if(whatsapp.value && whatsapp.value.length !== 10) { whatsapp.classList.add('error'); isValid = false; }

            if (!isValid) {
                alert("Please fill all required fields correctly / ചുവപ്പ് നിറത്തിൽ കാണുന്നവ കൃത്യമായി പൂരിപ്പിക്കുക");
                return;
            }

            // Construct Message
            const message = `*New H4 Waterproof Order*%0a%0a` + 
                            `Name: ${name.value}%0a` +
                            `Address: ${address.value}%0a` +
                            `Area: ${area.value}, Street: ${street.value}%0a` +
                            `Mobile: ${mobile.value}%0a` +
                            `WhatsApp: ${whatsapp.value || 'N/A'}%0a` +
                            `Pin: ${pincode.value}%0a` +
                            `District: ${district.value}%0a` +
                            `Target Area: ${wpArea.value}%0a` +
                            `Quantity: ${qty.value}`;

            // 1. Send to Shop Number
            const shopNumber = "9745838382";
            const shopUrl = `https://wa.me/91${shopNumber}?text=${message}`;
            window.open(shopUrl, '_blank');

            // 2. Send to Customer Number (if WhatsApp provided)
            if(whatsapp.value) {
                // Small delay to allow browser to handle first popup
                setTimeout(() => {
                    const custUrl = `https://wa.me/91${whatsapp.value}?text=Order Confirmed:%0a${message}`;
                    window.open(custUrl, '_blank');
                }, 1000);
            }

            // Show Share Button
            document.getElementById('btnShare').style.display = "block";
        }

        function resetForm() {
            document.querySelectorAll('input, textarea, select').forEach(el => el.value = '');
            document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
            document.getElementById('btnShare').style.display = "none";
        }

        async function shareDetails() {
            const message = "Check out H4 Waterproofing System! Best protection for your home.";
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'H4 Waterproofing',
                        text: message,
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Error sharing', err);
                }
            } else {
                alert("Sharing is not supported on this browser.");
            }
        }

        // Initial Load (Left side English as requested default)
        setLanguage('en');

    </script>
