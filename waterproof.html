<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Waterproof</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Noto Sans Malayalam',sans-serif;
 background:#f6f6fb;
 color:#222;
}
.container{max-width:1200px;margin:auto;padding:20px}
h1,h2,h3{font-weight:800}

/* LANGUAGE */
.lang-switch{
 display:flex;
 gap:10px;
 margin-bottom:20px
}
.lang-switch button{
 padding:10px 22px;
 border:none;
 border-radius:25px;
 font-weight:800;
 cursor:pointer;
 background:#000;
 color:#fff
}
.lang-switch .active{
 background:#f5c400;
 color:#000
}

/* GRID – FIXED 3×3 */
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 margin-top:30px;
}
@media(max-width:768px){
 .grid{
  grid-template-columns:repeat(3,1fr);
 }
}

.card{
 background:#fff;
 border-radius:14px;
 padding:20px;
 text-align:center;
 box-shadow:0 8px 20px rgba(0,0,0,.1);
 border-bottom:6px solid #f5c400;
}
.card img{
 width:90px;
 height:90px;
 object-fit:contain;
}
.card h4{
 margin:12px 0 6px;
 font-weight:800;
 font-size:16px
}
.card p{
 font-size:13px;
 color:#555
}

/* TEXT */
.section{
 background:#fff;
 margin-top:40px;
 padding:30px;
 border-radius:14px;
 line-height:1.9;
 box-shadow:0 5px 15px rgba(0,0,0,.08)
}

/* ORDER BUTTON */
.order-btn{
 margin:40px auto;
 display:block;
 padding:16px 44px;
 border:none;
 border-radius:30px;
 background:#1e90ff;
 color:#fff;
 font-size:18px;
 font-weight:800;
 cursor:pointer
}
</style>
</head>

<body>
<div class="container">

<!-- LANGUAGE -->
<div class="lang-switch">
<button class="active" onclick="setLang('en',this)">English</button>
<button onclick="setLang('ml',this)">Malayalam</button>
</div>

<h1 data-en="H4 Waterproof – 10 Years of Trusted Protection"
    data-ml="H4 Waterproof – 10 വർഷത്തെ വിശ്വാസനീയ സംരക്ഷണം">
H4 Waterproof – 10 Years of Trusted Protection
</h1>

<!-- 3×3 GRID -->
<div class="grid">

<div class="card">
<img src="images/icon.png">
<h4 data-en="Better Dampness Protection"
    data-ml="മികച്ച ഈർപ്പം പ്രതിരോധം"></h4>
<p data-en="Next 10 years peace of mind"
   data-ml="അടുത്ത 10 വർഷത്തെ നിങ്ങളുടെ സമാധാനം."></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Prevents Water Seepage"
    data-ml="വെള്ളം ചോരുന്നത് തടയുന്നു"></h4>
<p data-en="Molecular level protection"
   data-ml="മോളിക്യൂളർ തലത്തിലുള്ള സംരക്ഷണം"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="High Durability"
    data-ml="ഉയർന്ന ദീർഘായുസ്"></h4>
<p data-en="Long lasting performance"
   data-ml="ദീർഘകാല പ്രകടനം"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Foundation Safety"
    data-ml="അടിത്തറ സംരക്ഷണം"></h4>
<p data-en="Strong base protection"
   data-ml="ശക്തമായ അടിത്തറ"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Roof & Terrace"
    data-ml="റൂഫ് & ടെറസ്"></h4>
<p data-en="Complete top protection"
   data-ml="മുകളിലത്തെ പൂർണ്ണ സംരക്ഷണം"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Exterior Walls"
    data-ml="പുറമേയുള്ള മതിലുകൾ"></h4>
<p data-en="Weather resistance"
   data-ml="കാലാവസ്ഥ പ്രതിരോധം"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Balcony Safety"
    data-ml="ബാൽക്കണി സംരക്ഷണം"></h4>
<p data-en="No water damage"
   data-ml="വെള്ള നാശം ഇല്ല"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Basement Shield"
    data-ml="ബേസ്മെന്റ് സംരക്ഷണം"></h4>
<p data-en="Leak free foundation"
   data-ml="ചോർച്ച രഹിത അടിത്തറ"></p>
</div>

<div class="card">
<img src="images/icon.png">
<h4 data-en="Water Tank Safety"
    data-ml="വാട്ടർ ടാങ്ക് സുരക്ഷ"></h4>
<p data-en="Clean & safe storage"
   data-ml="ശുദ്ധവും സുരക്ഷിതവും"></p>
</div>

</div>

</div>

<script>
function setLang(l,b){
 document.querySelectorAll('.lang-switch button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 document.querySelectorAll('[data-en]').forEach(el=>{
  el.innerHTML = l==='ml'?el.dataset.ml:el.dataset.en;
 });
}
</script>

</body>
</html>
