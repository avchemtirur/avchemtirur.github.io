<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Waterproof</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Noto Sans Malayalam',sans-serif;
 background:#f6f6fb;
 color:#222;
}
.container{max-width:1200px;margin:auto;padding:20px}
h1,h2,h3{font-weight:800}
.lang-switch{display:flex;gap:10px;margin-bottom:20px}
.lang-switch button{
 padding:10px 22px;
 border:none;
 border-radius:25px;
 font-weight:800;
 cursor:pointer;
 background:#000;color:#fff
}
.lang-switch .active{background:#f5c400;color:#000}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 margin-top:30px;
}
.card{
 background:#fff;
 border-radius:14px;
 padding:20px;
 text-align:center;
 box-shadow:0 8px 20px rgba(0,0,0,.1);
 border-bottom:6px solid #f5c400;
}
.card img{
 width:90px;
 height:90px;
 object-fit:contain;
}
.card h4{margin:12px 0 6px;font-weight:800}
.card p{font-size:14px;color:#555}

/* TEXT */
.section{
 background:#fff;
 margin-top:40px;
 padding:30px;
 border-radius:14px;
 line-height:1.9;
 box-shadow:0 5px 15px rgba(0,0,0,.08)
}

/* ORDER BUTTON */
.order-btn{
 margin:40px auto;
 display:block;
 padding:16px 44px;
 border:none;
 border-radius:30px;
 background:#1e90ff;
 color:#fff;
 font-size:18px;
 font-weight:800;
 cursor:pointer
}

/* POPUP */
.popup{
 position:fixed;inset:0;
 background:rgba(0,0,0,.6);
 display:none;align-items:center;justify-content:center;
 z-index:1000;
}
.popup.active{display:flex}
.popup-box{
 background:#fff;
 width:95%;
 max-width:520px;
 padding:22px;
 border-radius:14px;
 max-height:90vh;
 overflow:auto;
}
.popup-box input,
.popup-box select,
.popup-box textarea{
 width:100%;
 padding:12px;
 margin:8px 0;
 font-size:16px;
 border-radius:8px;
 border:1px solid #ccc;
}
.error{border:2px solid red!important}
.btn-row{display:flex;gap:10px;margin-top:10px}
.confirm{flex:1;background:#1e90ff;color:#fff}
.cancel{flex:1;background:#ccc}
.share{margin-top:10px;background:#25d366;color:#fff;width:100%}
button{border:none;border-radius:25px;padding:14px;font-weight:800}

/* RESPONSIVE */
@media(max-width:768px){
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<!-- LANGUAGE -->
<div class="lang-switch">
<button class="active" onclick="setLang('en',this)">English</button>
<button onclick="setLang('ml',this)">Malayalam</button>
</div>

<h1 data-en="H4 Waterproof – 10 Years of Trusted Protection"
    data-ml="H4 Waterproof – 10 വർഷത്തെ വിശ്വാസനീയ സംരക്ഷണം">
H4 Waterproof – 10 Years of Trusted Protection
</h1>

<!-- 3×3 GRID -->
<div class="grid">
<script>
const cards=[
"Better Dampness Protection",
"Prevents Water Seepage",
"High Durability",
"Foundation Protection",
"Roof & Terrace",
"Exterior Walls",
"Balcony Safety",
"Basement Shield",
"Water Tank Safety"
];
document.write(cards.map(()=>`
<div class="card">
<img src="images/icon.png">
<h4 data-en="Better Dampness Protection" data-ml="മികച്ച ഈർപ്പം പ്രതിരോധം"></h4>
<p data-en="Next 10 years peace of mind"
   data-ml="അടുത്ത 10 വർഷത്തെ നിങ്ങളുടെ സമാധാനം."></p>
</div>`).join(""));
</script>
</div>

<button class="order-btn" onclick="openOrder()">Order Sheet</button>

<!-- CONTENT -->
<div class="section" data-ml="
മഴയുടെ ചുവപ്പും വെയിലിന്റെ ചുട്ടുപഴുപ്പും നിങ്ങളുടെ സ്വപ്നഭവനത്തിൽ ഇനി കലർത്തരുത്.

AV Chem Chemical & Manufacturing അവതരിപ്പിക്കുന്നു, ശാസ്ത്രത്തിന്റെ അതിരുകൾ വിട്ട് നിൽക്കുന്ന ഒരു സംരക്ഷണ കവചം: H4 Waterproof.

ഇത് ഒരു പെയിന്റ് അല്ല. ഇതൊരു കെമിക്കൽ ബോണ്ടിംഗ് സംവിധാനം ആണ്.
"
data-en="
Do not let rain and extreme heat damage your dream home.

AV Chem Chemical & Manufacturing presents a scientific shield of protection: H4 Waterproof.

This is not paint. This is a chemical bonding system.
"></div>

<div class="section">
<h3>🛡️ 10 Years 100% Guarantee</h3>
<p>
H4 integrates permanently with concrete at molecular level,
creating a second waterproof skin that lasts for decades.
</p>
</div>

<!-- ORDER POPUP -->
<div class="popup" id="orderPopup">
<div class="popup-box">
<h3>Order Sheet</h3>

<input id="name" placeholder="Name">
<input id="address" placeholder="Address">
<input id="area" placeholder="Area">
<input id="street" placeholder="Street">

<input id="mobile" placeholder="Mobile Number"
 inputmode="numeric" maxlength="10" oninput="numOnly(this)">
<label>
<input type="checkbox" onchange="copyWhatsapp(this)"> Same as WhatsApp
</label>

<input id="whatsapp" placeholder="WhatsApp Number"
 inputmode="numeric" maxlength="10" oninput="numOnly(this)">
<input id="pincode" placeholder="Pincode"
 inputmode="numeric" maxlength="6" oninput="numOnly(this)">
<input id="district" placeholder="District">
<input id="state" placeholder="State">

<select id="place">
<option value="">Waterproof Place</option>
<option>Home</option>
<option>Office</option>
<option>Shop</option>
<option>Building</option>
<option>Other</option>
</select>

<input id="qty" placeholder="Quantity (1 – 1000000)"
 inputmode="numeric" oninput="numOnly(this)">

<div class="btn-row">
<button class="confirm" onclick="sendWA()">Confirm</button>
<button class="cancel" onclick="closeOrder()">Cancel</button>
</div>

<button class="share" onclick="shareData()">Share</button>

</div>
</div>

</div>

<script>
function setLang(l,b){
 document.querySelectorAll('.lang-switch button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 document.querySelectorAll('[data-en]').forEach(el=>{
  el.innerHTML = l==='ml'?el.dataset.ml:el.dataset.en;
 });
}
function openOrder(){orderPopup.classList.add('active')}
function closeOrder(){orderPopup.classList.remove('active')}
function numOnly(el){el.value=el.value.replace(/\D/g,'')}
function copyWhatsapp(c){if(c.checked) whatsapp.value=mobile.value}

function sendWA(){
 let fields=[name,address,area,street,mobile,whatsapp,pincode,district,state,place,qty];
 fields.forEach(f=>f.classList.remove('error'));
 let valid=true;

 if(mobile.value.length!==10){mobile.classList.add('error');valid=false}
 if(whatsapp.value.length!==10){whatsapp.classList.add('error');valid=false}
 if(pincode.value.length!==6){pincode.classList.add('error');valid=false}
 fields.forEach(f=>{if(!f.value){f.classList.add('error');valid=false}});

 if(!valid) return;

 let msg=encodeURIComponent(
 "H4 Waterproof Order\n"+
 "Name:"+name.value+
 "\nMobile:"+mobile.value+
 "\nWhatsApp:"+whatsapp.value+
 "\nQty:"+qty.value
 );
 window.open("https://wa.me/919745838382?text="+msg);
 window.open("https://wa.me/91"+whatsapp.value+"?text="+msg);
}
function shareData(){
 navigator.share({text:"H4 Waterproof – Order Enquiry"});
}
</script>

</body>
</html>
