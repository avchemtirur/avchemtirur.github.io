<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>H4 Waterproof Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Malayalam Custom Font -->
<style>
@font-face{
    font-family:'MalayalamDisplay';
    src:url('https://fonts.googleapis.com/css2?family=Manjari:wght@700&display=swap');
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#ffffff;
    color:#4b2a6b;
}
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}
.lang-switch{
    text-align:right;
}
.lang-switch button{
    padding:8px 16px;
    background:#0b2c6f;
    color:#fff;
    border:none;
    margin-left:5px;
    border-radius:5px;
    cursor:pointer;
}

.malayalam-title{
    font-family:'MalayalamDisplay';
    font-size:36px;
    font-weight:900;
    color:#0b2c6f;
}
.english-title{
    font-size:34px;
    font-weight:800;
    color:#0b2c6f;
}

.form-box{
    background:#f7f7ff;
    padding:20px;
    border-radius:8px;
    margin-top:25px;
}
label{
    display:block;
    margin-top:12px;
    font-weight:600;
}
input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:4px;
    border:1px solid #ccc;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}
.buttons button{
    flex:1;
    padding:12px;
    font-size:16px;
    font-weight:bold;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
.confirm{background:#0b2c6f;color:#fff;}
.cancel{background:#888;color:#fff;}

.popup{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
}
.popup-box{
    background:#fff;
    padding:25px;
    border-radius:10px;
    text-align:center;
    max-width:300px;
}
.popup-box h3{
    color:#0b2c6f;
}
.hidden{display:none;}
</style>
</head>

<body>
<div class="container">

<div class="lang-switch">
<button onclick="ml()">Malayalam</button>
<button onclick="en()">English</button>
</div>

<!-- MALAYALAM -->
<div id="ml">
<h1 class="malayalam-title">H4 Waterproof – 10 വർഷത്തെ ശാശ്വത സംരക്ഷണം</h1>

<div class="form-box">
<label>പേര്</label><input id="name">
<label>വിലാസം</label><input id="address">
<label>ഏരിയ</label><input id="area">
<label>സ്ട്രീറ്റ്</label><input id="street">
<label>ലാൻഡ്മാർക്ക്</label><input id="landmark">
<label>മൊബൈൽ</label><input id="mobile">
<label>WhatsApp</label><input id="whatsapp">
<label>പിൻകോഡ്</label><input id="pincode">
<label>ജില്ല</label><input id="district">
<label>സംസ്ഥാനം</label><input id="state">

<label>Waterproof ചെയ്യേണ്ട സ്ഥലം</label>
<select id="place">
<option>Home</option>
<option>Terrace</option>
<option>Bathroom</option>
<option>Water Tank</option>
</select>

<div class="buttons">
<button class="confirm" onclick="submitForm('Confirm')">Confirm</button>
<button class="cancel" onclick="submitForm('Cancel')">Cancel</button>
</div>
</div>
</div>

<!-- ENGLISH -->
<div id="en" class="hidden">
<h1 class="english-title">H4 Waterproof – A Decade of Protection</h1>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">
<h3>Thank You!</h3>
<p>Your details have been submitted successfully.</p>
<button onclick="closePopup()">OK</button>
</div>
</div>

<script>
function ml(){document.getElementById("ml").style.display="block";document.getElementById("en").style.display="none";}
function en(){document.getElementById("ml").style.display="none";document.getElementById("en").style.display="block";}

function submitForm(status){
let data={
name:name.value,address:address.value,area:area.value,
street:street.value,landmark:landmark.value,
mobile:mobile.value,whatsapp:whatsapp.value,
pincode:pincode.value,district:district.value,
state:state.value,place:place.value,status:status
};

fetch("PASTE_GOOGLE_SCRIPT_URL_HERE",{method:"POST",body:JSON.stringify(data)})
.then(()=>{document.getElementById("popup").style.display="flex";});
}

function closePopup(){document.getElementById("popup").style.display="none";}
</script>

</body>
</html>
