<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Waterproof</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans Malayalam',sans-serif;
  background:#f6f2fb;
  color:#222;
}

.container{max-width:1200px;margin:auto;padding:20px}

/* LANGUAGE */
.lang-switch{display:flex;gap:10px;margin-bottom:20px}
.lang-switch button{
  padding:8px 20px;border:none;border-radius:20px;
  background:#000;color:#fff;font-weight:800;cursor:pointer
}
.lang-switch button.active{background:#f5c400;color:#000}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
}
.card img{
  width:90px;height:90px;object-fit:contain
}
.card b{display:block;font-size:18px;margin-top:10px}
.card p{font-size:14px;color:#555}

/* ORDER */
.order-btn{
  margin:40px auto;display:block;
  padding:14px 40px;font-size:18px;
  border:none;border-radius:30px;
  background:#1e90ff;color:#fff;font-weight:800
}

/* POPUP */
.popup{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;justify-content:center;align-items:center;
}
.popup.active{display:flex}
.popup-box{
  background:#fff;width:95%;max-width:520px;
  padding:20px;border-radius:14px
}
.popup-box input,.popup-box select,.popup-box textarea{
  width:100%;padding:10px;margin:6px 0;
  border-radius:6px;border:1px solid #ccc;font-size:16px
}
.error{border:2px solid red!important}
.btn-row{display:flex;gap:10px;margin-top:10px}
.confirm{flex:1;background:#1e90ff;color:#fff}
.cancel{flex:1;background:#ccc}
.share{margin-top:10px;background:#25d366;color:#fff;width:100%}
button{padding:12px;border:none;border-radius:25px;font-weight:800}
</style>
</head>

<body>
<div class="container">

<div class="lang-switch">
<button class="active" onclick="setLang('en',this)">English</button>
<button onclick="setLang('ml',this)">Malayalam</button>
</div>

<h2 data-en="H4 Waterproof – 10 Years of Trusted Protection"
    data-ml="H4 Waterproof – 10 വർഷത്തെ വിശ്വാസനീയ സംരക്ഷണം">
H4 Waterproof – 10 Years of Trusted Protection
</h2>

<div class="grid">
<script>
const items=[
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind",
"Next 10 years peace of mind"
];
document.write(items.map(()=>`
<div class="card">
<img src="images/water.png">
<b>H4 Waterproof</b>
<p>അടുത്ത 10 വർഷത്തെ നിങ്ങളുടെ സമാധാനം.</p>
</div>`).join(""));
</script>
</div>

<button class="order-btn" onclick="openOrder()">Order Sheet</button>

<!-- ORDER POPUP -->
<div class="popup" id="orderPopup">
<div class="popup-box">

<input id="name" placeholder="Name">
<input id="address" placeholder="Address">
<input id="area" placeholder="Area">
<input id="street" placeholder="Street">

<input id="mobile" placeholder="Mobile Number" inputmode="numeric" maxlength="10" oninput="numOnly(this)">
<label><input type="checkbox" onchange="copyWhatsapp(this)"> Same as WhatsApp</label>

<input id="whatsapp" placeholder="WhatsApp Number" inputmode="numeric" maxlength="10" oninput="numOnly(this)">
<input id="pincode" placeholder="Pincode" inputmode="numeric" maxlength="6" oninput="numOnly(this)">
<input placeholder="District">
<input placeholder="State">

<select id="place" onchange="showOther(this)">
<option value="">Waterproof Place</option>
<option>Home</option><option>Office</option>
<option>Shop</option><option>Building</option>
<option>Other</option>
</select>
<input id="otherPlace" placeholder="Enter Place" style="display:none">

<input id="qty" placeholder="Quantity (1–1000000)" inputmode="numeric" oninput="numOnly(this)">

<div class="btn-row">
<button class="confirm" onclick="sendWA()">Confirm</button>
<button class="cancel" onclick="closeOrder()">Cancel</button>
</div>

<button class="share" onclick="shareData()">Share</button>

</div>
</div>

</div>

<script>
function setLang(l,b){
 document.querySelectorAll('.lang-switch button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 document.querySelectorAll('[data-en]').forEach(el=>{
  el.innerHTML=l==='ml'?el.dataset.ml:el.dataset.en;
 });
}
function openOrder(){orderPopup.classList.add('active')}
function closeOrder(){orderPopup.classList.remove('active')}
function numOnly(el){el.value=el.value.replace(/\D/g,'')}
function copyWhatsapp(c){if(c.checked) whatsapp.value=mobile.value}
function showOther(s){otherPlace.style.display=s.value==='Other'?'block':'none'}

function sendWA(){
 let m=mobile,w=whatsapp,p=pincode;
 [m,w,p].forEach(x=>x.classList.remove('error'));
 if(m.value.length!==10){m.classList.add('error');return}
 if(w.value.length!==10){w.classList.add('error');return}
 if(p.value.length!==6){p.classList.add('error');return}

 let msg=encodeURIComponent(
 "H4 Waterproof Order\n"+
 "Name:"+name.value+
 "\nMobile:"+m.value+
 "\nWhatsApp:"+w.value+
 "\nQty:"+qty.value
 );
 window.open("https://wa.me/919745838382?text="+msg);
 window.open("https://wa.me/91"+w.value+"?text="+msg);
}
function shareData(){
 navigator.share({text:"H4 Waterproof Order"});
}
</script>

</body>
</html>
