<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Tile Adhesive</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans Malayalam',sans-serif;
  background:#f6f2fb;
  color:#222;
}
.container{max-width:1200px;margin:auto;padding:20px}

/* Language */
.lang-switch{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}
.lang-switch button{
  border:none;
  padding:6px 14px;
  border-radius:20px;
  background:#000;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
.lang-switch button.active{
  background:#f5c400;
  color:#000;
}

/* Headings */
h1{
  font-size:32px;
  font-weight:800;
}
.section-title{
  margin:40px 0 20px;
  font-size:26px;
  font-weight:800;
  border-left:6px solid #f5c400;
  padding-left:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:16px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  border-bottom:6px solid #f5c400;
  transition:.3s;
}
.card:hover{
  transform:translateY(-6px);
}

/* ICON */
.icon{
  width:120px;
  height:120px;
  margin:auto;
  margin-bottom:18px;
}

/* Text */
.card b{
  display:block;
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}
.card span{
  font-size:15px;
  line-height:1.5;
}

/* Order Button */
.order-btn{
  display:block;
  margin:45px auto;
  padding:14px 36px;
  font-size:18px;
  font-weight:800;
  border:none;
  border-radius:30px;
  background:#f5c400;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}
.popup.active{display:flex}
.popup-box{
  background:#fff;
  width:90%;
  max-width:420px;
  padding:25px;
  border-radius:14px;
  animation:pop .4s ease;
}
@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}
.popup-box h3{margin-top:0}
.popup-box input, .popup-box textarea{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
.popup-box button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  font-weight:800;
  border-radius:20px;
  background:#f5c400;
}

/* Responsive */
@media(max-width:768px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="container">

<!-- LANGUAGE -->
<div class="lang-switch">
<button class="active" onclick="setLang('ml',this)">Malayalam</button>
<button onclick="setLang('en',this)">English</button>
</div>

<h1 data-ml="H4 Tile Adhesive – പ്രീമിയം ടൈൽ ഫിക്സിംഗ് സൊല്യൂഷൻ"
    data-en="H4 Tile Adhesive – Premium Tile Fixing Solution">
H4 Tile Adhesive – പ്രീമിയം ടൈൽ ഫിക്സിംഗ് സൊല്യൂഷൻ
</h1>

<div class="section-title"
data-ml="H4 Tile Adhesive ഉപയോഗ മേഖലകൾ"
data-en="Application Areas of H4 Tile Adhesive">
H4 Tile Adhesive ഉപയോഗ മേഖലകൾ
</div>

<!-- GRID -->
<div class="grid">

<!-- 1 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#4fc3f7">
<path d="M20 50h60v30H20z"/><path d="M20 20h60v20H20z"/>
</svg>
<b data-ml="മാർബിൾ ടൈൽ" data-en="Marble Tiles">മാർബിൾ ടൈൽ</b>
<span data-ml="പ്രകൃതിദത്ത മാർബിൾ ടൈലുകൾക്ക് ശക്തമായ ബോണ്ടിംഗ്"
      data-en="Strong bonding for natural marble tiles"></span>
</div>

<!-- 2 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#81c784">
<rect x="20" y="20" width="60" height="60"/>
</svg>
<b data-ml="ഗ്രാനൈറ്റ്" data-en="Granite Tiles">ഗ്രാനൈറ്റ്</b>
<span data-ml="ഹൈ ഡെൻസിറ്റി ഗ്രാനൈറ്റിനായി"
      data-en="Ideal for high density granite tiles"></span>
</div>

<!-- 3 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#ffb74d">
<rect x="10" y="30" width="80" height="40"/>
</svg>
<b data-ml="മാർബോനൈറ്റ് (Large Size)"
   data-en="Marbonite (Large Size)">മാർബോനൈറ്റ്</b>
<span data-ml="6×4 / 8×4 വലിയ ടൈലുകൾ"
      data-en="Perfect for large format tiles"></span>
</div>

<!-- 4 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#ba68c8">
<path d="M20 20h60v60H20z"/>
</svg>
<b data-ml="ബാത്റൂം ടൈൽ"
   data-en="Bathroom Tiles">ബാത്റൂം ടൈൽ</b>
<span data-ml="ഈർപ്പമുള്ള ഇടങ്ങൾക്കായി"
      data-en="Ideal for wet areas"></span>
</div>

<!-- 5 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#ff8a65">
<path d="M30 10h40v80H30z"/>
</svg>
<b data-ml="വാൾ ടൈൽ"
   data-en="Wall Tiles">വാൾ ടൈൽ</b>
<span data-ml="ഇന്റീരിയർ & എക്സ്റ്റീരിയർ"
      data-en="Interior & exterior walls"></span>
</div>

<!-- 6 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#4db6ac">
<rect x="10" y="50" width="80" height="30"/>
</svg>
<b data-ml="ഫ്ലോർ ടൈൽ"
   data-en="Floor Tiles">ഫ്ലോർ ടൈൽ</b>
<span data-ml="ഹെവി ട്രാഫിക് ഏരിയകൾ"
      data-en="Heavy traffic floors"></span>
</div>

<!-- 7 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#ffd54f">
<polygon points="10,60 50,20 90,60"/>
</svg>
<b data-ml="ബാൽക്കണി"
   data-en="Balcony">ബാൽക്കണി</b>
<span data-ml="വെയിലും മഴയും നേരിടുന്ന ഇടങ്ങൾ"
      data-en="Weather exposed areas"></span>
</div>

<!-- 8 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#90a4ae">
<rect x="20" y="20" width="60" height="60"/>
</svg>
<b data-ml="ടെറസ് ടൈൽ"
   data-en="Terrace Tiles">ടെറസ് ടൈൽ</b>
<span data-ml="ഔട്ട്‌ഡോർ ഫ്ലോറിംഗ്"
      data-en="Outdoor flooring"></span>
</div>

<!-- 9 -->
<div class="card">
<svg class="icon" viewBox="0 0 100 100" fill="#f06292">
<circle cx="50" cy="50" r="30"/>
</svg>
<b data-ml="കിച്ചൻ ടൈൽ"
   data-en="Kitchen Tiles">കിച്ചൻ ടൈൽ</b>
<span data-ml="ഓയിൽ & ഈർപ്പം പ്രതിരോധം"
      data-en="Oil & moisture resistance"></span>
</div>

</div>

<button class="order-btn" onclick="openOrder()"
data-ml="ഓർഡർ ഷീറ്റ്"
data-en="Order Sheet">ഓർഡർ ഷീറ്റ്</button>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">
<h3>Order Sheet</h3>
<input placeholder="Name">
<input placeholder="Phone">
<textarea placeholder="Address"></textarea>
<button onclick="closeOrder()">Submit</button>
</div>
</div>

<script>
function setLang(lang,btn){
 document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 document.querySelectorAll('[data-ml]').forEach(el=>{
   el.innerHTML = lang==='ml'?el.dataset.ml:el.dataset.en;
 });
}
function openOrder(){document.getElementById('popup').classList.add('active')}
function closeOrder(){document.getElementById('popup').classList.remove('active')}
</script>

</body>
</html>
