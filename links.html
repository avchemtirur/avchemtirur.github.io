<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>H4 Construction Solutions | Premium Builders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', 'Roboto', sans-serif;
      background: radial-gradient(circle at 10% 30%, #eef3fc, #dbe5f0);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* premium floating background particles */
    .bg-float {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .float-shape {
      position: absolute;
      background: radial-gradient(circle, rgba(11,45,92,0.08) 0%, rgba(11,45,92,0) 70%);
      border-radius: 50%;
      animation: floatAnimation 28s infinite ease-in-out;
      filter: blur(3px);
    }

    @keyframes floatAnimation {
      0% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-30px) translateX(15px) rotate(4deg); opacity: 0.6; }
      100% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.4; }
    }

    /* main card container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      padding: 40px 32px 52px 32px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 72px 72px 80px 80px;
      box-shadow: 0 35px 60px -16px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.8) inset;
      animation: subtlePulse 5s infinite;
    }

    /* Logo + Brand Section */
    .logo-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Premium Logo Wrapper with CSS-drawn H4 Logo to prevent missing file error */
    .logo-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      border: 3.5px solid rgba(255,255,255,0.9);
      background: #000; /* Exact black background from 1000807558.png */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Perfect replica of your logo using pure high-fidelity CSS shapes */
    .css-h4-logo {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Left circle with 'H' cutout */
    .logo-left-circle {
      position: relative;
      width: 38px;
      height: 38px;
      background-color: #9c27b0; /* Original purple color from 1000807558.png */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-left-circle::before {
      content: 'H';
      font-family: 'Arial Black', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #000;
      position: absolute;
    }

    /* Right circle with '4' cutout */
    .logo-right-circle {
      position: relative;
      width: 38px;
      height: 38px;
      background-color: #ffb300; /* Original yellow-orange color from 1000807558.png */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-right-circle::before {
      content: '4';
      font-family: 'Arial Black', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #000;
      position: absolute;
    }

    /* Continuous Golden Shine Overlay (Right to Left) */
    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 30%;
      height: 200%;
      background: linear-gradient(
        to left,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 215, 0, 0.4) 30%,
        rgba(255, 255, 255, 0.7) 50%,
        rgba(255, 215, 0, 0.4) 70%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(30deg);
      animation: goldenShine 4s infinite linear;
      pointer-events: none;
    }

    @keyframes goldenShine {
      0% {
        left: 150%;
      }
      100% {
        left: -150%;
      }
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0b2d5c 0%, #1a4a7a 45%, #0f3b64 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.08);
      margin-bottom: 8px;
      line-height: 1.2;
      text-align: center;
    }

    .since-badge {
      display: inline-block;
      background: rgba(11,45,92,0.12);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 80px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #0b2d5c;
      letter-spacing: 1px;
      margin-top: 6px;
      text-align: center;
    }

    /* SUBTITLE */
    .subtitle {
      font-size: 1.55rem;
      font-weight: 700;
      color: #1f3a4b;
      background: rgba(255,255,240,0.85);
      display: inline-block;
      padding: 18px 44px;
      border-radius: 100px;
      backdrop-filter: blur(2px);
      margin-bottom: 36px;
      letter-spacing: 0.5px;
      border: 1.5px solid rgba(11,45,92,0.2);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      width: auto;
      max-width: 95%;
    }

    /* BUTTONS */
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin: 32px 0 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-decoration: none;
      padding: 24px 22px;
      border-radius: 90px;
      font-weight: 800;
      font-size: 1.5rem;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      color: white;
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.6);
      background-size: 200% auto;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(2px);
      letter-spacing: 0.3px;
      animation: btnFloatUp 0.85s cubic-bezier(0.2, 0.9, 0.4, 1.2) backwards;
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, 0.95);
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 28px 40px -14px rgba(0, 0, 0, 0.35);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255,255,255,0.5));
      transition: left 0.5s ease;
      z-index: 0;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn span {
      position: relative;
      z-index: 2;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn span:first-child {
      font-size: 2.1rem;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }

    /* button colors */
    .google { background: linear-gradient(105deg, #dd4b3e, #c13a2e); }
    .facebook { background: linear-gradient(105deg, #1877f2, #1264d6); }
    .instagram { background: linear-gradient(115deg, #fccc4d, #fd1d1d, #d62976, #962fbf); background-size: 140% auto; }
    .youtube { background: linear-gradient(105deg, #ff0000, #cc0000); }
    .website { background: linear-gradient(105deg, #0066cc, #004b99); }
    .whatsapp { background: linear-gradient(105deg, #25d366, #128C7E); }
    .call { background: linear-gradient(105deg, #28a745, #1f8b3a); }
    .location { background: linear-gradient(105deg, #ff9800, #e67e22); }
    .email { background: linear-gradient(105deg, #6c757d, #495057); }

    @keyframes btnFloatUp {
      0% { opacity: 0; transform: translateY(45px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .btn:nth-child(1) { animation-delay: 0.04s; }
    .btn:nth-child(2) { animation-delay: 0.09s; }
    .btn:nth-child(3) { animation-delay: 0.14s; }
    .btn:nth-child(4) { animation-delay: 0.19s; }
    .btn:nth-child(5) { animation-delay: 0.24s; }
    .btn:nth-child(6) { animation-delay: 0.29s; }
    .btn:nth-child(7) { animation-delay: 0.34s; }
    .btn:nth-child(8) { animation-delay: 0.39s; }
    .btn:nth-child(9) { animation-delay: 0.44s; }

    @keyframes subtlePulse {
      0% { box-shadow: 0 0 0 0 rgba(11,45,92,0.12); }
      70% { box-shadow: 0 0 0 18px rgba(11,45,92,0); }
      100% { box-shadow: 0 0 0 0 rgba(11,45,92,0); }
    }

    .container::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2.5px;
      background: linear-gradient(125deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 80%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .btn:focus-visible {
      outline: 3px solid #ffb347;
      outline-offset: 4px;
    }

    /* responsive */
    @media (max-width: 700px) {
      .container { padding: 32px 24px 44px; }
      h1 { font-size: 2.6rem; }
      .btn { padding: 20px 18px; font-size: 1.3rem; gap: 16px; border-width: 2.5px; }
      .btn span:first-child { font-size: 1.9rem; }
      .subtitle { font-size: 1.3rem; padding: 14px 36px; }
      .logo-wrapper { width: 95px; height: 95px; }
      .css-h4-logo { width: 70px; height: 70px; }
      .logo-left-circle, .logo-right-circle { width: 32px; height: 32px; }
      .logo-left-circle::before, .logo-right-circle::before { font-size: 22px; }
    }

    @media (max-width: 550px) {
      .container { padding: 28px 20px 38px; border-radius: 56px; }
      h1 { font-size: 2.2rem; }
      .btn { padding: 18px 16px; font-size: 1.15rem; gap: 12px; border-width: 2px; }
      .btn span:first-child { font-size: 1.6rem; }
      .subtitle { font-size: 1.1rem; padding: 12px 28px; }
      .logo-wrapper { width: 85px; height: 85px; }
      .css-h4-logo { width: 60px; height: 60px; }
      .logo-left-circle, .logo-right-circle { width: 28px; height: 28px; }
      .logo-left-circle::before, .logo-right-circle::before { font-size: 18px; }
    }
  </style>
</head>

<script>
  (function() {
    // floating shapes dynamic randomness (slower)
    const shapes = document.querySelectorAll('.float-shape');
    if(shapes.length) {
      shapes.forEach((shape) => {
        const randomDur = 26 + Math.random() * 22;
        const randomDelay = Math.random() * 9;
        shape.style.animationDuration = `${randomDur}s`;
        shape.style.animationDelay = `${randomDelay}s`;
      });
    }
    
    // button click effect
    const btns = document.querySelectorAll('.btn');
    btns.forEach(btn => {
      btn.addEventListener('click', function(e) {
        this.style.transform = 'scale(0.97)';
        setTimeout(() => { if(this) this.style.transform = ''; }, 140);
      });
    });
    
    const updateFullscreen = () => {
      const vh = window.innerHeight;
      document.body.style.minHeight = `${vh}px`;
    };
    updateFullscreen();
    window.addEventListener('resize', updateFullscreen);
    window.addEventListener('orientationchange', updateFullscreen);
    
    const container = document.querySelector('.container');
    if(container && window.innerWidth > 768) {
      container.addEventListener('mouseenter', () => {
        container.style.transform = 'translateY(-6px)';
        container.style.transition = 'transform 0.35s ease';
        container.style.boxShadow = '0 45px 70px -18px rgba(0,0,0,0.45), 0 0 0 2px rgba(255,255,255,0.85) inset';
      });
      container.addEventListener('mouseleave', () => {
        container.style.transform = '';
        container.style.boxShadow = '';
      });
    }
  })();
</script>
