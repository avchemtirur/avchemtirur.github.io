<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive & Waterproof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body,html{height:100%;overflow:hidden;color:#fff}

/* VIDEO BACKGROUND */
.video-bg{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:radial-gradient(circle at left,#7a1fa2,#000),
            radial-gradient(circle at right,#1e3cff,#000);
 z-index:-2;
}
.video-overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.6);
 z-index:-1;
}

/* TOP BAR */
.navbar{
 position:fixed;top:0;width:100%;
 display:flex;justify-content:space-between;align-items:center;
 padding:14px 24px;
 background:rgba(0,0,0,0.5);
 backdrop-filter:blur(10px);
 z-index:10;
}
.navbar a{
 color:#fff;text-decoration:none;margin-left:20px;
 font-size:16px;cursor:pointer;
}
.navbar a:hover{color:#b26cff}

/* CENTER HERO */
.hero{
 height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
}
.hero img{
 width:140px;
 margin-bottom:20px;
 animation:zoom 2s infinite alternate;
}
@keyframes zoom{
 from{transform:scale(1)}
 to{transform:scale(1.08)}
}
.hero h1{
 font-size:36px;
 letter-spacing:1px;
 animation:textGlow 2s infinite alternate;
}
@keyframes textGlow{
 from{text-shadow:0 0 10px #9b2cff}
 to{text-shadow:0 0 25px #3cfffa}
}

/* FOLDERS */
.folders{
 position:absolute;
 bottom:90px;
 display:flex;
 gap:30px;
}
.folder{
 width:120px;height:90px;
 background:linear-gradient(135deg,#222,#111);
 border-radius:10px;
 text-align:center;
 padding-top:25px;
 cursor:pointer;
 transition:0.4s;
}
.folder:hover{
 transform:translateY(-10px) scale(1.05);
 box-shadow:0 0 20px #9b2cff;
}
.folder span{font-size:14px}

/* PANELS */
.panel{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.85);
 display:none;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:20px;
 z-index:20;
}
.panel h2{margin-bottom:20px}
.panel input,.panel select{
 width:260px;padding:10px;margin:6px;border-radius:6px;border:none;
}
.panel button{
 margin-top:10px;padding:10px 22px;border:none;border-radius:20px;
 background:#9b2cff;color:#fff;cursor:pointer;
}
.back{
 margin-top:20px;
 background:#333;
}

/* LANGUAGE */
.lang{
 position:fixed;
 bottom:20px;right:20px;
}
.lang button{
 background:#222;color:#fff;border:none;padding:8px 14px;
 border-radius:20px;margin-left:5px;cursor:pointer;
}
</style>
</head>

<body>

<div class="video-bg"></div>
<div class="video-overlay"></div>

<!-- NAV -->
<div class="navbar">
 <div></div>
 <div>
  <a onclick="openHome()">Home</a>
  <a onclick="openDealer()">Dealer Enquiry</a>
  <a onclick="openContact()">Contact</a>
 </div>
</div>

<!-- HERO -->
<div class="hero" id="home">
 <img src="h4logo.png" alt="H4 Logo">
 <h1>H4 Tile Adhesive & Waterproof</h1>

 <div class="folders">
  <div class="folder"><span>Tile Adhesive</span></div>
  <div class="folder"><span>Waterproof</span></div>
  <div class="folder"><span>H4 ShieldX</span></div>
 </div>
</div>

<!-- DEALER -->
<div class="panel" id="dealer">
 <h2>Dealer Enquiry</h2>
 <input placeholder="Customer Name">
 <input placeholder="City">
 <input placeholder="Mobile Number">
 <input placeholder="WhatsApp Number">
 <input placeholder="District">
 <input placeholder="State">
 <select>
  <option>Tile Adhesive</option>
  <option>Waterproof</option>
  <option>H4 ShieldX</option>
 </select>
 <select>
  <option>Bag</option>
  <option>Kg</option>
 </select>
 <button onclick="sendWA()">Confirm</button>
 <button class="back" onclick="closeAll()">Back</button>
</div>

<!-- CONTACT -->
<div class="panel" id="contact">
 <h2>Contact</h2>
 <button onclick="location.href='tel:+917907344030'">📞 Call</button>
 <button onclick="location.href='https://wa.me/919745838382'">💬 WhatsApp</button>
 <button onclick="location.href='mailto:avchemtirur@gmail.com'">✉ Email</button>
 <button class="back" onclick="closeAll()">Back</button>
</div>

<!-- LANGUAGE -->
<div class="lang">
 <button onclick="alert('English Enabled')">EN</button>
 <button onclick="alert('Malayalam Enabled')">ML</button>
</div>

<script>
function openDealer(){
 closeAll();
 document.getElementById('dealer').style.display='flex';
}
function openContact(){
 closeAll();
 document.getElementById('contact').style.display='flex';
}
function openHome(){
 closeAll();
}
function closeAll(){
 document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
}
function sendWA(){
 let msg="Dealer Enquiry from Website";
 window.open("https://wa.me/919745838382?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
