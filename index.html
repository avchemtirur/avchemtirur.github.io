<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>H4 Tile Adhesive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        /* ===== HEADER ===== */
        .site-header {
            padding: 15px 30px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .logo {
            height: 55px;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            background: #DCE8E6;
            padding: 60px 40px;
        }

        .hero-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .hero-text {
            max-width: 50%;
        }

        .hero-text h1 {
            font-size: 42px;
            color: #1F3A37;
            margin-bottom: 10px;
        }

        .hero-text p {
            font-size: 18px;
            color: #333;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 26px;
            border-radius: 25px;
            text-decoration: none;
            background: #283593;
            color: #fff;
            margin-right: 10px;
            font-size: 16px;
        }

        .btn-whatsapp {
            background: #25D366;
        }

        /* ===== HERO IMAGES ===== */
        .hero-image {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            width: 220px;
            max-width: 100%;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .hero-inner {
                flex-direction: column;
                text-align: center;
            }

            .hero-text {
                max-width: 100%;
            }

            .hero-image {
                margin-top: 30px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
    <img src="AV.png" alt="H4 Logo" class="logo">
</header>

<!-- ===== HERO SECTION ===== -->
<section class="hero">
    <div class="hero-inner">

        <div class="hero-text">
            <h1>Premium H4 Tile Adhesive & Waterproofing</h1>
            <p>
                High-strength polymer modified tile adhesive for wall & floor tiles.  
                Trusted across Kerala for strong bonding and durability.
            </p>

            <a href="tel:+917907344030" class="btn">Call Now</a>
            <a href="https://wa.me/91974588382" target="_blank" class="btn btn-whatsapp">
                WhatsApp Order
            </a>
        </div>

        <div class="hero-image">
            <img src="bag-blue.png" alt="H4 Tile Adhesive Blue Bag">
            <img src="bag-yellow.png" alt="H4 Tile Adhesive Yellow Bag">
        </div>

    </div>
</section>

</body>
</html>
