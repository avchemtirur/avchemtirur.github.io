
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0b14;
    color:#fff;
}
button{
    cursor:pointer;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
}
.btn{
    background:#1e1e2f;
    color:#fff;
}
.btn-green{background:#00c853;color:#000;}
.btn-red{background:#d50000;}
.btn-purple{background:#7c4dff;}
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    overflow:auto;
}
.modal-content{
    background:#111827;
    margin:40px auto;
    padding:20px;
    border-radius:12px;
    max-width:800px;
}
.close{
    float:right;
    font-size:22px;
    cursor:pointer;
}
input,select,textarea{
    width:100%;
    padding:10px;
    margin:6px 0 12px;
    border-radius:6px;
    border:none;
}
label{font-size:14px;color:#bbb;}
.section-btns{
    display:flex;
    gap:10px;
    justify-content:center;
    padding:20px;
}
.lang-btn{
    width:100%;
    margin-top:10px;
}
.thankyou{
    text-align:center;
    padding:30px;
}
</style>
</head>

<body>

<!-- ACTION BUTTONS -->
<div class="section-btns">
    <button class="btn" onclick="openLang('waterproof')">Waterproof</button>
    <button class="btn" onclick="openLang('bond')">High Bond Strength</button>
    <button class="btn" onclick="openOrder()">Order</button>
    <button class="btn" onclick="openDealer()">Dealer Enquiry</button>
    <button class="btn-purple" onclick="openContact()">Contact</button>
</div>

<!-- LANGUAGE SELECT -->
<div id="langModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal('langModal')">×</span>
<h3>Select Language</h3>
<button class="btn lang-btn" onclick="openContent('ml')">മലയാളം</button>
<button class="btn lang-btn" onclick="openContent('en')">English</button>
</div>
</div>

<!-- CONTENT MODAL -->
<div id="contentModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal('contentModal')">×</span>
<div id="contentArea"></div>
</div>
</div>

<!-- ORDER FORM -->
<div id="orderModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal('orderModal')">×</span>
<h3>Customer Order Form</h3>

<label>Name</label><input id="o_name">
<label>Mobile</label><input id="o_mobile">
<label>Product</label>
<select id="o_product">
<option>Tile Adhesive</option>
<option>Waterproof</option>
</select>
<label>Quantity</label><input id="o_qty">
<label>Remarks</label><textarea id="o_remark"></textarea>

<button class="btn-green" onclick="sendOrder(true)">Confirm</button>
<button class="btn-red" onclick="sendOrder(false)">Cancel</button>
</div>
</div>

<!-- DEALER FORM -->
<div id="dealerModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal('dealerModal')">×</span>
<h3>Dealer Enquiry</h3>

<input id="d_name" placeholder="Your Name">
<input id="d_address" placeholder="Address">
<input id="d_email" placeholder="Email">
<input id="d_phone" placeholder="Contact Number">
<input id="d_whatsapp" placeholder="WhatsApp Number">
<input id="d_landmark" placeholder="Landmark (Optional)">
<input id="d_pincode" placeholder="Pincode">
<input id="d_city" placeholder="City">
<input id="d_district" placeholder="District">
<input id="d_state" placeholder="State">

<select id="d_item">
<option>Tile Adhesive</option>
<option>Waterproof</option>
</select>
<input id="d_qty" placeholder="Quantity">

<button class="btn-green" onclick="sendDealer(true)">Confirm</button>
<button class="btn-red" onclick="sendDealer(false)">Cancel</button>
</div>
</div>

<!-- THANK YOU -->
<div id="thankModal" class="modal">
<div class="modal-content thankyou">
<h2>🙏 Thank You!</h2>
<p>Your request has been sent successfully.</p>
<button class="btn" onclick="closeModal('thankModal')">Close</button>
</div>
</div>

<script>
let currentType="";

function openLang(type){
    currentType=type;
    document.getElementById('langModal').style.display="block";
}
function openContent(lang){
    closeModal('langModal');
    let html="";
    if(currentType==="waterproof"){
        html = (lang==="ml") ? `<!-- Malayalam Waterproof Content -->
        <h2>H4 Waterproof – 10 വർഷം വിശ്വാസത്തിന്റെ ഉറപ്പ്</h2>
        <p>H4 Waterproof സാധാരണ waterproof അല്ല...</p>` :
        `<h2>H4 Waterproof – 10 Years of Trusted Protection</h2>
        <p>H4 Waterproof is not an ordinary product...</p>`;
    }else{
        html = (lang==="ml") ? `<h2>High Bond Strength</h2><p>അകത്ത് ഉണ്ടാകുന്ന പിടുത്തം...</p>` :
        `<h2>High Bond Strength</h2><p>The bond you don't see...</p>`;
    }
    document.getElementById('contentArea').innerHTML=html;
    document.getElementById('contentModal').style.display="block";
}
function openOrder(){document.getElementById('orderModal').style.display="block";}
function openDealer(){document.getElementById('dealerModal').style.display="block";}
function closeModal(id){document.getElementById(id).style.display="none";}
function openContact(){
    window.open("https://wa.me/919745838382","_blank");
    window.location.href="tel:+917907344030";
}

function sendOrder(confirm){
let msg=`ORDER ${confirm?"CONFIRMED":"CANCELLED"}
Name:${o_name.value}
Mobile:${o_mobile.value}
Product:${o_product.value}
Qty:${o_qty.value}`;
window.open("https://wa.me/919745838382?text="+encodeURIComponent(msg));
closeModal('orderModal');
if(confirm) document.getElementById('thankModal').style.display="block";
}

function sendDealer(confirm){
let msg=`DEALER ${confirm?"CONFIRM":"CANCEL"}
Name:${d_name.value}
Item:${d_item.value}
Qty:${d_qty.value}`;
window.open("https://wa.me/919745838382?text="+encodeURIComponent(msg));
closeModal('dealerModal');
if(confirm) document.getElementById('thankModal').style.display="block";
}
</script>

</body>
</html>
