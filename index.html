<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem – Landing Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#0b1218;
  color:#fff;
}

/* NAVBAR */
.navbar{
  position:absolute;
  top:0;
  width:100%;
  padding:18px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}
.navbar .brand{
  font-size:20px;
  font-weight:500;
}
.navbar a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  font-size:13px;
  opacity:.85;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  position:relative;
  overflow:hidden;
}

/* BLUE LAYERS */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg,
      transparent 0%,
      #1c6fa1 40%,
      transparent 70%);
  opacity:.8;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(-135deg,
      transparent 0%,
      #0b4f6c 40%,
      transparent 70%);
  opacity:.7;
}

/* MAIN CARD */
.container{
  max-width:1100px;
  width:100%;
  background:#1a232c;
  border-radius:18px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  overflow:hidden;
  position:relative;
  z-index:2;
}

/* LEFT */
.left{
  padding:60px;
}
.left h1{
  font-size:36px;
  margin-bottom:14px;
}
.left p{
  font-size:14px;
  opacity:.85;
  line-height:1.6;
  max-width:420px;
}
.left .btn{
  display:inline-block;
  margin-top:24px;
  padding:10px 22px;
  background:#fff;
  color:#000;
  border-radius:20px;
  font-size:13px;
  text-decoration:none;
}

/* RIGHT CARD */
.right{
  background:#fff;
  color:#000;
  padding:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:100%;
  max-width:260px;
  text-align:center;
}
.card h3{
  margin-bottom:20px;
}
.card input{
  width:100%;
  padding:10px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:6px;
}
.card button{
  width:100%;
  padding:10px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:6px;
}

/* MOBILE */
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
  .right{
    display:none;
  }
  .left{
    padding:40px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <div class="brand">AV Chem</div>
  <div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Service</a>
    <a href="#">Contact</a>
  </div>
</div>

<section class="hero">
  <div class="container">
    <div class="left">
      <h1>H4 Tile Adhesive & Waterproof</h1>
      <p>
        High bond strength tile adhesive and waterproof solutions  
        specially designed for Kerala climate conditions.
      </p>
      <a class="btn" href="#">Read More</a>
    </div>

    <div class="right">
      <div class="card">
        <h3>Your Company</h3>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
      </div>
    </div>
  </div>
</section>

</body>
</html>
