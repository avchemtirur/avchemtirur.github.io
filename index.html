<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Tile Adhesive & Waterproof</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
}
.lang button{
  margin-bottom:5px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #00ffff;
  background:transparent;
  color:#00ffff;
}
.menu{
  text-align:right;
}
.menu div{
  margin:6px 0;
  cursor:pointer;
  font-size:18px;
}
.menu div:hover{color:#00ffff}

/* CENTER TITLE */
.center{
  text-align:center;
  margin-top:30px;
}
.center h1{
  font-size:32px;
  animation:fadeZoom 2s ease;
}
@keyframes fadeZoom{
  from{opacity:0;transform:scale(1.3)}
  to{opacity:1;transform:scale(1)}
}

/* HOME CONTENT */
#home,#dealer,#contact{display:none;padding:20px;text-align:center;}
#home img{width:120px;margin-bottom:10px;}
.address p{line-height:1.6}

/* FOLDERS */
.folders{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:25px;
}
.folder{
  width:95px;
  padding:15px 5px;
  border:1px solid #00ffff;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}
.folder:hover{transform:scale(1.08);background:rgba(0,255,255,0.1)}

/* BAGS */
.bags{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}
.bags img{
  width:110px;
  animation:float 3s infinite ease-in-out;
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

/* FORMS */
input,select{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
.btn{
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
}
.confirm{background:#00c853;color:#fff}
.cancel{background:#d50000;color:#fff}

/* CONTACT */
.contact-box p{
  font-size:20px;
  margin:12px 0;
}
a{color:#00ffff;text-decoration:none}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="lang">
    <button onclick="setLang('en')">EN</button><br>
    <button onclick="setLang('ml')">ML</button>
  </div>
  <div class="menu">
    <div onclick="show('home')">Home</div>
    <div onclick="show('dealer')">Dealer Enquiry</div>
    <div onclick="show('contact')">Contact</div>
  </div>
</div>

<!-- CENTER TITLE -->
<div class="center">
  <h1 id="title">H4 Tile Adhesive & Waterproof</h1>
</div>

<!-- HOME -->
<div id="home">
  <img src="avlogo.png">
  <div class="address">
    <p><b>AV Chem Chemical & Manufacturing</b></p>
    <p>Mukkilapeedika, Kannam Kulam</p>
    <p>PO BP Angadi, Tirur</p>
    <p>Malappuram, Kerala, India</p>
  </div>

  <div class="folders">
    <div class="folder" onclick="openFolder('Tile Adhesive')">Tile Adhesive</div>
    <div class="folder" onclick="openFolder('Waterproof')">Waterproof</div>
    <div class="folder" onclick="openFolder('H4 ShieldX')">H4 ShieldX</div>
  </div>

  <div class="bags">
    <img src="bag-yellow.png">
    <img src="bag-purple.png">
  </div>
</div>

<!-- DEALER -->
<div id="dealer">
  <h2>Dealer Enquiry</h2>
  <input placeholder="Customer Name">
  <input placeholder="City">
  <input placeholder="Mobile Number">
  <input placeholder="WhatsApp Number (optional)">
  <input placeholder="District">
  <input placeholder="State">
  <select>
    <option>Tile Adhesive</option>
    <option>Waterproof</option>
    <option>H4 ShieldX</option>
  </select>
  <select>
    <option>Bag</option>
    <option>Kg</option>
  </select><br>
  <button class="btn confirm" onclick="sendWA()">Confirm</button>
  <button class="btn cancel" onclick="show('home')">Cancel</button>
</div>

<!-- CONTACT -->
<div id="contact">
  <div class="contact-box">
    <p>📞 <a href="tel:+917907344030">+91 79073 44030</a></p>
    <p>💬 <a href="https://wa.me/919745838382">+91 97458 38382</a></p>
    <p>✉️ <a href="mailto:avchemtirur@gmail.com">avchemtirur@gmail.com</a></p>
  </div>
  <button class="btn cancel" onclick="show('home')">Back</button>
</div>

<script>
function show(id){
  document.querySelectorAll('#home,#dealer,#contact').forEach(d=>d.style.display='none');
  document.getElementById(id).style.display='block';
}
show('home');

function openFolder(name){
  alert(name + " opened");
}

function sendWA(){
  window.open("https://wa.me/919745838382?text=Dealer%20Enquiry%20from%20Website");
}

function setLang(l){
  if(l==='ml'){
    document.getElementById('title').innerText="H4 ടൈൽ അഡ്ഹേസീവ് & വാട്ടർപ്രൂഫ്";
  }else{
    document.getElementById('title').innerText="H4 Tile Adhesive & Waterproof";
  }
}
</script>

</body>
</html>
