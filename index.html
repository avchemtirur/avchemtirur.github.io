<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive & Waterproof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== IMAGE STYLE BACKGROUND ===== */
body{
  min-height:100vh;
  color:#ffffff;
  background:
    radial-gradient(circle at 70% 30%, rgba(0,255,255,0.18), transparent 45%),
    radial-gradient(circle at 30% 70%, rgba(0,180,180,0.22), transparent 45%),
    linear-gradient(135deg, #020b0e, #03161a, #020b0e);
  background-attachment: fixed;
}

/* ===== TOP MENU ===== */
.menu{
  display:flex;
  justify-content:flex-end;
  gap:20px;
  padding:18px;
  font-size:18px;
}

.menu span{
  cursor:pointer;
  opacity:0.85;
}

.menu span:hover{
  opacity:1;
}

/* ===== MAIN ===== */
.main{
  text-align:center;
  padding:40px 15px;
}

h1{
  font-size:34px;
  margin-bottom:10px;
}

.tagline{
  color:#22e6d3;
  font-size:18px;
  margin-bottom:35px;
}

/* ===== BUTTON BOXES ===== */
.boxes{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.box{
  width:110px;
  height:110px;
  border:2px solid #22e6d3;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  transition:0.3s;
}

.box:hover{
  background:rgba(34,230,211,0.15);
  transform:scale(1.05);
}

/* ===== SECTIONS ===== */
.section{
  display:none;
  padding:30px 20px;
  text-align:center;
}

.section h2{
  margin-bottom:20px;
}

/* ===== FORM ===== */
input{
  width:100%;
  max-width:340px;
  padding:14px;
  margin:10px auto;
  border-radius:10px;
  border:none;
  font-size:16px;
  display:block;
}

.btn{
  width:150px;
  padding:14px;
  margin:12px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
}

.confirm{background:#1ecf72;color:#000;}
.cancel{background:#e00000;color:#fff;}

a{
  color:#22e6d3;
  text-decoration:none;
  display:block;
  margin:12px 0;
  font-size:18px;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="menu">
  <span onclick="show('home')">Home</span>
  <span onclick="show('dealer')">Dealer Enquiry</span>
  <span onclick="show('contact')">Contact</span>
</div>

<!-- HOME -->
<div id="home" class="main section" style="display:block;">
  <h1>H4 Tile Adhesive & Waterproof</h1>
  <div class="tagline">Molecular Bonding. Peaceful Dwelling...</div>

  <div class="boxes">
    <div class="box">Tile<br>Adhesive</div>
    <div class="box">Waterproof</div>
    <div class="box">H4<br>ShieldX</div>
  </div>
</div>

<!-- DEALER -->
<div id="dealer" class="section">
  <h2>Dealer Enquiry</h2>
  <input placeholder="Customer Name">
  <input placeholder="Mobile Number">
  <input placeholder="City">
  <input placeholder="District">
  <input placeholder="State">

  <button class="btn confirm"
    onclick="sendWhatsApp()">Confirm</button>
  <button class="btn cancel"
    onclick="show('home')">Cancel</button>
</div>

<!-- CONTACT -->
<div id="contact" class="section">
  <h2>Contact</h2>
  <a href="tel:+917907344030">📞 Call : +91 79073 44030</a>
  <a href="https://wa.me/919745838382">💬 WhatsApp : 9745838382</a>
  <a href="mailto:avchemtirur@gmail.com">✉️ avchemtirur@gmail.com</a>
</div>

<script>
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
}

function sendWhatsApp(){
  const msg = encodeURIComponent(
    "Dealer Enquiry from H4 Website"
  );
  window.open("https://wa.me/919745838382?text="+msg,"_blank");
}
</script>

</body>
</html>
