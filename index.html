<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem Chemical & Manufacturing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#0b1218;
  color:#fff;
}

/* NAVBAR */
.navbar{
  position:absolute;
  top:0;
  width:100%;
  padding:18px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}

/* AV CHEM SCRIPT FONT */
.navbar .brand{
  font-family:'Great Vibes', cursive;
  font-size:32px;
  font-weight:400;
  padding-left:4rem;   /* 👈 left gap */
  color:#ffffff;
}

.navbar a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  font-size:13px;
  opacity:.85;
}

/* HERO BACKGROUND */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  position:relative;
  overflow:hidden;
}

/* BLUE–PURPLE LAYERS */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 50%, rgba(160,70,255,.55), transparent 55%);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 75% 55%, rgba(40,120,255,.55), transparent 55%);
}

/* CONTENT CARD */
.container{
  max-width:1100px;
  width:100%;
  background:#1a232c;
  border-radius:20px;
  padding:70px;
  position:relative;
  z-index:2;
}

/* MAIN HEADING */
.container h1{
  font-size:42px;
  margin-bottom:16px;
  letter-spacing:1px;
}

/* DESCRIPTION */
.container p{
  font-size:15px;
  opacity:.85;
  line-height:1.7;
  max-width:520px;
}

/* BUTTONS */
.btn-group{
  margin-top:28px;
  display:flex;
  gap:16px;
}

.btn-primary{
  padding:12px 26px;
  background:linear-gradient(135deg,#7b3fe4,#9b5cff);
  color:#fff;
  text-decoration:none;
  border-radius:30px;
  font-size:14px;
  font-weight:500;
}

.btn-outline{
  padding:12px 26px;
  border:1px solid #fff;
  color:#fff;
  text-decoration:none;
  border-radius:30px;
  font-size:14px;
}

/* MOBILE */
@media(max-width:768px){
  .navbar .brand{
    font-size:26px;
    padding-left:1.5rem;
  }

  .container{
    padding:45px;
  }

  .container h1{
    font-size:30px;
  }

  .btn-group{
    flex-direction:column;
    width:100%;
  }

  .btn-primary,
  .btn-outline{
    text-align:center;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="brand">
    AV Chem Chemical & Manufacturing
  </div>
  <div>
    <a href="#">Home</a>
    <a href="#">Dealer Enquiry</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <h1>H4 Tile Adhesive</h1>
    <p>
      Premium polymer modified tile adhesive for wall & floor applications.
      High bond strength, waterproof performance and long-lasting durability,
      specially designed for Kerala climate.
    </p>

    <div class="btn-group">
      <a href="#" class="btn-primary">Become a Dealer</a>
      <a href="tel:+917907344030" class="btn-outline">Call Now</a>
    </div>
  </div>
</section>

</body>
</html>
