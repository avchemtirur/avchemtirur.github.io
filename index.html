
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive & Waterproof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
 width:100%;height:100%;
 font-family:Arial,Helvetica,sans-serif;
 background:#050607;
 color:#fff;
 overflow:hidden;
}

/* BACKGROUND – SAME IMAGE STYLE */
.bg{
 position:fixed;inset:0;
 background:
  radial-gradient(60% 40% at 30% 50%, #0f3c44, transparent 70%),
  radial-gradient(60% 40% at 70% 50%, #132b4d, transparent 70%),
  #050607;
 z-index:-2;
}
.bg::after{
 content:"";
 position:absolute;inset:0;
 background:rgba(0,0,0,.55);
}

/* TOP BAR */
.nav{
 position:fixed;top:0;width:100%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:14px 26px;
 backdrop-filter:blur(12px);
 background:rgba(0,0,0,.45);
 z-index:10;
}
.nav a{
 color:#fff;text-decoration:none;
 margin-left:22px;
 font-size:17px;
 cursor:pointer;
}
.nav a:hover{opacity:.7}

/* LANGUAGE */
.lang{
 display:flex;gap:8px;
}
.lang button{
 background:#111;color:#fff;
 border:1px solid #333;
 padding:6px 12px;
 border-radius:20px;
 cursor:pointer;
 font-size:13px;
}

/* HERO */
.hero{
 height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
}
.hero img{
 width:140px;
 margin-bottom:16px;
 animation:logoPulse 2s ease-in-out infinite alternate;
}
@keyframes logoPulse{
 from{transform:scale(1)}
 to{transform:scale(1.08)}
}
.hero h1{
 font-size:36px;
 letter-spacing:1px;
 animation:textGlow 2s infinite alternate;
}
@keyframes textGlow{
 from{text-shadow:0 0 10px #2bb0ff}
 to{text-shadow:0 0 22px #7ce7ff}
}

/* FOLDERS */
.folders{
 position:absolute;
 bottom:90px;
 display:flex;
 gap:34px;
}
.folder{
 width:126px;
 height:96px;
 background:linear-gradient(135deg,#111,#050505);
 border-radius:12px;
 text-align:center;
 padding-top:30px;
 cursor:pointer;
 transition:.4s;
}
.folder:hover{
 transform:translateY(-10px) scale(1.08);
 box-shadow:0 0 20px rgba(124,231,255,.5);
}
.folder span{
 font-size:15px;
}

/* PANELS */
.panel{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.85);
 display:none;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:24px;
 z-index:20;
 animation:fade .4s ease;
}
@keyframes fade{
 from{opacity:0;transform:scale(.96)}
 to{opacity:1;transform:scale(1)}
}
.panel h2{
 font-size:28px;
 margin-bottom:18px;
}
.panel input,.panel select{
 width:300px;
 padding:12px;
 margin:6px 0;
 border-radius:8px;
 border:none;
 font-size:16px;
}
.panel button{
 margin-top:14px;
 padding:12px 26px;
 border:none;
 border-radius:26px;
 background:#2bb0ff;
 color:#000;
 font-size:16px;
 cursor:pointer;
}
.back{
 background:#333;color:#fff;
}

/* CONTACT BUTTONS */
.contact-btn{
 width:280px;
 margin:8px 0;
}

/* FOOTER BACK */
.footer-back{
 position:absolute;
 bottom:24px;
}

/* RESPONSIVE */
@media(max-width:600px){
 .hero h1{font-size:30px}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- NAV -->
<div class="nav">
 <div class="lang">
  <button onclick="setLang('en')">EN</button>
  <button onclick="setLang('ml')">ML</button>
 </div>
 <div>
  <a onclick="showHome()">Home</a>
  <a onclick="showDealer()">Dealer Enquiry</a>
  <a onclick="showContact()">Contact</a>
 </div>
</div>

<!-- HOME -->
<div class="hero" id="home">
 <img src="h4logo.png">
 <h1 id="title">H4 Tile Adhesive & Waterproof</h1>

 <div class="folders">
  <div class="folder" onclick="openFolder('Tile Adhesive')"><span>Tile Adhesive</span></div>
  <div class="folder" onclick="openFolder('Waterproof')"><span>Waterproof</span></div>
  <div class="folder" onclick="openFolder('H4 ShieldX')"><span>H4 ShieldX</span></div>
 </div>
</div>

<!-- DEALER -->
<div class="panel" id="dealer">
 <h2 id="dealerTitle">Dealer Enquiry</h2>
 <input placeholder="Customer Name">
 <input placeholder="City">
 <input placeholder="Mobile Number">
 <input placeholder="WhatsApp Number">
 <input placeholder="District">
 <input placeholder="State">
 <select>
  <option>Tile Adhesive</option>
  <option>Waterproof</option>
  <option>H4 ShieldX</option>
 </select>
 <select>
  <option>Bag</option>
  <option>Kg</option>
 </select>
 <button onclick="sendWA()">Confirm</button>
 <div class="footer-back">
  <button class="back" onclick="closeAll()">Back</button>
 </div>
</div>

<!-- CONTACT -->
<div class="panel" id="contact">
 <h2 id="contactTitle">Contact</h2>
 <button class="contact-btn" onclick="location.href='tel:+917907344030'">📞 +91 79073 44030</button>
 <button class="contact-btn" onclick="location.href='https://wa.me/919745838382'">💬 WhatsApp</button>
 <button class="contact-btn" onclick="location.href='mailto:avchemtirur@gmail.com'">✉ avchemtirur@gmail.com</button>
 <div class="footer-back">
  <button class="back" onclick="closeAll()">Back</button>
 </div>
</div>

<script>
function closeAll(){
 document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
}
function showHome(){closeAll();}
function showDealer(){
 closeAll();
 document.getElementById('dealer').style.display='flex';
}
function showContact(){
 closeAll();
 document.getElementById('contact').style.display='flex';
}
function sendWA(){
 window.open("https://wa.me/919745838382?text=Dealer%20Enquiry");
}
function openFolder(name){
 alert(name+" selected");
}

/* LANGUAGE */
function setLang(l){
 if(l==='ml'){
  document.getElementById('title').innerText="H4 ടൈൽ അഡ്ഹീസീവ് & വാട്ടർപ്രൂഫ്";
  document.getElementById('dealerTitle').innerText="ഡീലർ എൻക്വറി";
  document.getElementById('contactTitle').innerText="ബന്ധപ്പെടുക";
 }else{
  document.getElementById('title').innerText="H4 Tile Adhesive & Waterproof";
  document.getElementById('dealerTitle').innerText="Dealer Enquiry";
  document.getElementById('contactTitle').innerText="Contact";
 }
}
</script>

</body>
</html>
