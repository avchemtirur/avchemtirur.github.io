
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive & Waterproof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
html,body{height:100%;background:#000;color:#fff}

/* ===== BACKGROUND (Verify to Trust AI style) ===== */
.bg{
 position:fixed;inset:0;
 background:
 radial-gradient(circle at center,#1a3a44 0%,#020405 55%,#000 100%);
 z-index:-2;
}
.wave{
 position:absolute;inset:0;
 background:
 radial-gradient(circle at 30% 50%,rgba(0,180,200,.25),transparent 60%),
 radial-gradient(circle at 70% 55%,rgba(0,120,255,.25),transparent 60%);
 z-index:-1;
}

/* ===== TOP BAR ===== */
.top{
 position:fixed;top:0;width:100%;
 display:flex;justify-content:space-between;align-items:center;
 padding:14px 24px;
 background:rgba(0,0,0,.45);
 backdrop-filter:blur(12px);
 z-index:10;
}
.top a{color:#fff;margin-left:18px;text-decoration:none;font-size:17px}
.top a:hover{color:#7fdfff}

/* ===== LANGUAGE ===== */
.lang button{
 background:#111;border:1px solid #2f6c77;
 color:#9defff;padding:6px 14px;
 border-radius:20px;cursor:pointer;margin-right:6px;
}

/* ===== HERO ===== */
.hero{
 height:100vh;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 text-align:center;
}
.hero img{
 width:190px;
 animation:logoZoom 3s ease forwards;
}
@keyframes logoZoom{
 0%{transform:scale(1.6);opacity:0}
 60%{transform:scale(1)}
 100%{transform:scale(.85)}
}
.hero h1{
 margin-top:20px;
 font-size:40px;
 color:#e9fdff;
 text-shadow:0 0 25px #7fdfff;
 animation:fadeText 3s forwards;
}
@keyframes fadeText{
 from{opacity:0;letter-spacing:6px}
 to{opacity:1;letter-spacing:1px}
}

/* ===== FOLDERS ===== */
.folders{
 position:absolute;bottom:100px;
 display:flex;gap:36px;
}
.folder{
 width:135px;height:95px;
 background:linear-gradient(135deg,#0b1d22,#02090b);
 border:1px solid #2f6c77;
 border-radius:14px;
 display:flex;align-items:center;justify-content:center;
 cursor:pointer;
 transition:.4s;
}
.folder:hover{
 transform:translateY(-10px) scale(1.08);
 box-shadow:0 0 25px #7fdfff;
}
.folder span{font-size:15px}

/* ===== PANELS ===== */
.panel{
 position:fixed;inset:0;
 background:rgba(0,0,0,.92);
 display:none;flex-direction:column;
 justify-content:center;align-items:center;
 z-index:20;
}
.panel h2{
 font-size:30px;
 margin-bottom:18px;
 text-shadow:0 0 20px #7fdfff;
}
.panel input,.panel select{
 width:300px;
 padding:14px;
 margin:6px;
 border:none;border-radius:8px;
 font-size:17px;
}
.panel button{
 margin-top:10px;
 padding:12px 26px;
 font-size:17px;
 border:none;border-radius:30px;
 background:#2f6c77;color:#fff;
 cursor:pointer;
}
.back{background:#222}

/* ===== CONTACT CENTER ===== */
.contactBox{
 background:rgba(10,25,30,.6);
 padding:30px 40px;
 border-radius:20px;
 text-align:center;
}
.contactBox button{
 display:block;
 width:260px;
 margin:10px auto;
 font-size:18px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
 .hero h1{font-size:30px}
 .folder{width:120px}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="wave"></div>

<!-- TOP BAR -->
<div class="top">
 <div class="lang">
  <button onclick="setLang('en')">EN</button>
  <button onclick="setLang('ml')">ML</button>
 </div>
 <div>
  <a onclick="showHome()">Home</a>
  <a onclick="showDealer()">Dealer Enquiry</a>
  <a onclick="showContact()">Contact</a>
 </div>
</div>

<!-- HERO -->
<div class="hero" id="home">
 <img src="h4logo.png">
 <h1 id="titleText">H4 Tile Adhesive & Waterproof</h1>

 <div class="folders">
  <div class="folder" onclick="openFolder('Tile Adhesive')"><span>Tile Adhesive</span></div>
  <div class="folder" onclick="openFolder('Waterproof')"><span>Waterproof</span></div>
  <div class="folder" onclick="openFolder('H4 ShieldX')"><span>H4 ShieldX</span></div>
 </div>
</div>

<!-- DEALER -->
<div class="panel" id="dealer">
 <h2>Dealer Enquiry</h2>
 <input placeholder="Customer Name">
 <input placeholder="City">
 <input placeholder="Mobile Number">
 <input placeholder="WhatsApp Number">
 <input placeholder="District">
 <input placeholder="State">
 <select>
  <option>Tile Adhesive</option>
  <option>Waterproof</option>
  <option>H4 ShieldX</option>
 </select>
 <select>
  <option>Bag</option>
  <option>Kg</option>
 </select>
 <button onclick="sendWA()">Confirm</button>
 <button class="back" onclick="closeAll()">Back</button>
</div>

<!-- CONTACT -->
<div class="panel" id="contact">
 <div class="contactBox">
  <h2>Contact</h2>
  <button onclick="location.href='tel:+917907344030'">📞 +91 79073 44030</button>
  <button onclick="location.href='https://wa.me/919745838382'">💬 WhatsApp</button>
  <button onclick="location.href='mailto:avchemtirur@gmail.com'">✉ avchemtirur@gmail.com</button>
  <button class="back" onclick="closeAll()">Back</button>
 </div>
</div>

<script>
function closeAll(){
 document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
}
function showDealer(){closeAll();dealer.style.display='flex'}
function showContact(){closeAll();contact.style.display='flex'}
function showHome(){closeAll()}
function openFolder(name){
 alert(name+" opened");
}
function sendWA(){
 window.open("https://wa.me/919745838382?text=Dealer Enquiry from Website");
}
function setLang(l){
 if(l=='ml'){
  titleText.innerText="H4 ടൈൽ അഡ്ഹീസീവ് & വാട്ടർപ്രൂഫ്";
 }else{
  titleText.innerText="H4 Tile Adhesive & Waterproof";
 }
}
</script>

</body>
</html>
