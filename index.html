<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#05050b;color:#fff}

/* ================= HEADER ================= */
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 30px;
}
header nav a{
  color:#ccc;margin:0 14px;text-decoration:none;font-size:14px;
}
header nav a:hover{color:#fff}
.signin{
  border:1px solid #555;padding:6px 16px;border-radius:20px;
}

/* ================= HERO ================= */
.hero{
  min-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at left, #7c2cff55, transparent 40%),
    radial-gradient(circle at right, #2563eb55, transparent 40%),
    #05050b;
}
.hero h1{font-size:60px;letter-spacing:4px}
.hero p{color:#aaa;margin:20px auto;max-width:650px}
.hero button{
  padding:14px 34px;border-radius:30px;
  border:none;background:#6366f1;color:#fff;font-weight:700;
}

/* ================= TOP ACTION BUTTONS ================= */
.actions{
  display:flex;
  gap:14px;
  justify-content:center;
  padding:30px 20px;
  flex-wrap:wrap;
}
.btn{
  background:#111827;
  color:#fff;
  padding:16px 28px;
  border:none;
  border-radius:16px;
  font-weight:700;
  font-size:16px;
  min-width:160px;
}
.btn:hover{background:#1f2937}

/* ================= MODAL ================= */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:9999;
  overflow:auto;
}
.modal-box{
  background:#0f172a;
  color:#e5e7eb;
  max-width:860px;
  margin:20px auto;
  padding:22px;
  border-radius:18px;

  /* 🔥 HEIGHT FIX */
  max-height:60vh;      /* 40% reduced */
  overflow-y:auto;
}
.close{
  float:right;
  font-size:22px;
  cursor:pointer;
}
.modal-box h2,.modal-box h3{
  font-size:20px;
  margin-bottom:10px;
}

/* ================= FORM ================= */
input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0 12px;
  border-radius:10px;
  border:none;
}
label{font-size:14px;color:#9ca3af}
.row{display:flex;gap:12px;flex-wrap:wrap}
.green{background:#22c55e;color:#000}
.red{background:#ef4444}
.center{text-align:center}

/* ================= MOBILE ================= */
@media(max-width:600px){
  .hero h1{font-size:42px}
  .btn{width:100%;font-size:17px;padding:18px}
  .modal-box{max-height:55vh}
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
  <div>◯ COMPANY</div>
  <nav>
    <a href="#">HOME</a>
    <a href="#">ABOUT US</a>
    <a href="#">CONTACT US</a>
  </nav>
  <div class="signin">SIGN IN</div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <div>
    <h1>WELCOME</h1>
    <p>Premium polymer modified tile adhesive & waterproof solutions with long-lasting durability.</p>
    <button onclick="openOrder()">LEARN MORE</button>
  </div>
</section>

<!-- ================= ACTION BUTTONS ================= -->
<div class="actions">
  <button class="btn" onclick="openLang('waterproof')">Waterproof</button>
  <button class="btn" onclick="openLang('bond')">High Bond Strength</button>
  <button class="btn" onclick="openOrder()">Order</button>
  <button class="btn" onclick="openDealer()">Dealer Enquiry</button>
  <button class="btn" onclick="openContact()">Contact</button>
</div>

<!-- ================= LANGUAGE SELECT ================= -->
<div id="langModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeM('langModal')">×</span>
    <h3>Select Language</h3>
    <button class="btn" style="width:100%" onclick="showContent('ml')">മലയാളം</button><br><br>
    <button class="btn" style="width:100%" onclick="showContent('en')">English</button>
  </div>
</div>

<!-- ================= CONTENT ================= -->
<div id="contentModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeM('contentModal')">×</span>
    <div id="contentArea"></div>
  </div>
</div>

<!-- ================= ORDER FORM ================= -->
<div id="orderModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeM('orderModal')">×</span>
    <h3>Customer Order</h3>
    <input id="o_name" placeholder="Customer Name">
    <input id="o_mobile" placeholder="Mobile Number">
    <select id="o_product">
      <option>Tile Adhesive</option>
      <option>Waterproof</option>
    </select>
    <input id="o_qty" placeholder="Quantity">
    <textarea id="o_remark" placeholder="Remarks"></textarea>
    <div class="row">
      <button class="btn green" onclick="sendOrder(true)">Confirm</button>
      <button class="btn red" onclick="sendOrder(false)">Cancel</button>
    </div>
  </div>
</div>

<!-- ================= DEALER FORM ================= -->
<div id="dealerModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeM('dealerModal')">×</span>
    <h3>Dealer Enquiry</h3>
    <input id="d_name" placeholder="Your Name">
    <input id="d_address" placeholder="Address">
    <input id="d_email" placeholder="Email">
    <input id="d_phone" placeholder="Contact Number">
    <input id="d_whatsapp" placeholder="WhatsApp Number">
    <input id="d_landmark" placeholder="Landmark (Optional)">
    <input id="d_pincode" placeholder="Pincode">
    <input id="d_city" placeholder="City">
    <input id="d_district" placeholder="District">
    <input id="d_state" placeholder="State">
    <select id="d_item">
      <option>Tile Adhesive</option>
      <option>Waterproof</option>
    </select>
    <input id="d_qty" placeholder="Quantity">
    <div class="row">
      <button class="btn green" onclick="sendDealer(true)">Confirm</button>
      <button class="btn red" onclick="sendDealer(false)">Cancel</button>
    </div>
  </div>
</div>

<!-- ================= THANK YOU ================= -->
<div id="thankModal" class="modal">
  <div class="modal-box center">
    <h2>🙏 Thank You</h2>
    <p>Your request has been sent successfully.</p><br>
    <button class="btn" onclick="closeM('thankModal')">Close</button>
  </div>
</div>

<script>
const WA="919745838382";
const CALL="+917907344030";
let CURRENT="";

function openLang(t){CURRENT=t;openM('langModal')}
function openOrder(){openM('orderModal')}
function openDealer(){openM('dealerModal')}
function openContact(){
  window.open("https://wa.me/"+WA,"_blank");
  window.location.href="tel:"+CALL;
}
function openM(id){document.getElementById(id).style.display="block"}
function closeM(id){document.getElementById(id).style.display="none"}

function sendOrder(c){
let m=`CUSTOMER ORDER ${c?"CONFIRMED":"CANCELLED"}
Name:${o_name.value}
Mobile:${o_mobile.value}
Product:${o_product.value}
Quantity:${o_qty.value}`;
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m));
closeM('orderModal');
if(c)openM('thankModal');
}
function sendDealer(c){
let m=`DEALER ${c?"CONFIRMED":"CANCELLED"}
Name:${d_name.value}
City:${d_city.value}
Item:${d_item.value}
Quantity:${d_qty.value}`;
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m));
closeM('dealerModal');
if(c)openM('thankModal');
}

function showContent(l){
closeM('langModal');
contentArea.innerHTML =
(CURRENT==="waterproof")
? (l==="ml"
? `<h2>H4 Waterproof – 10 വർഷം വിശ്വാസത്തിന്റെ ഉറപ്പ്</h2>
<p>വെള്ളത്തിനെതിരെ ശക്തമായ ഒരു കവചം.</p>`
: `<h2>H4 Waterproof – 10 Years of Trusted Protection</h2>
<p>A strong shield against water.</p>`)
: (l==="ml"
? `<h2>High Bond Strength</h2>
<p>അകത്ത് ഉണ്ടാകുന്ന പിടുത്തമാണ് യഥാർത്ഥ ശക്തി.</p>`
: `<h2>High Bond Strength</h2>
<p>The bond you don’t see decides everything.</p>`);
openM('contentModal');
}
</script>

</body>
</html>
