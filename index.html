
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="utf-8">
    <title>AV Chem | Chemical & Manufacturing</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-pink: #e91e63;
            --dark-bg: #000000;
            --card-bg: #111111;
            --error-red: #ff4d4d;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Top Bar */
        .top-nav {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--primary-pink);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            margin: 0 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover { background: var(--primary-pink); }

        /* Main Sections */
        .content-section {
            display: none;
            padding-top: 100px;
            min-height: 100vh;
            text-align: center;
        }

        .active-section { display: block; }

        /* Folder Grid */
        .folder-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .folder-card {
            background: var(--card-bg);
            border: 2px solid #222;
            width: 250px;
            padding: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.4s;
        }

        .folder-card:hover { border-color: var(--primary-pink); transform: translateY(-5px); }
        .folder-card i { font-size: 40px; color: var(--primary-pink); margin-bottom: 15px; }

        /* Order Form Styles */
        .order-form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #111;
            padding: 30px;
            border-radius: 15px;
            text-align: left;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #bbb; }
        .form-control {
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
        }

        .form-control:focus { background: #222; border-color: var(--primary-pink); color: white; box-shadow: none; }
        
        .is-invalid { border-color: var(--error-red) !important; }
        .error-text { color: var(--error-red); font-size: 12px; display: none; }

        .btn-confirm { background-color: #007bff; color: white; width: 48%; }
        .btn-cancel { background-color: #6c757d; color: white; width: 48%; }

        /* Bag Image Animation */
        .hero-img { width: 200px; animation: float 3s infinite ease-in-out; margin: 10px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

    </style>
</head>
<body>

    <div class="top-nav text-center">
        <button class="nav-btn" onclick="showSection('home')">Home</button>
        <button class="nav-btn" onclick="showSection('contact')">Contact</button>
        <button class="nav-btn" onclick="showSection('dealer')">Dealer Enquiry</button>
    </div>

    <div id="home" class="content-section active-section">
        <img src="av.png.ogo" alt="AV Logo" style="height: 60px; margin-bottom: 20px;">
        <h2>WELCOME TO</h2>
        <img src="h4logo.png" alt="H4 Logo" style="width: 150px;">
        <h1 style="color: var(--primary-pink);">H4 Tile Adhesive & Water Proof</h1>
        
        <div class="folder-grid">
            <div class="folder-card" onclick="window.open('tile-adhesive.html', '_blank')">
                <i class="fas fa-layer-group"></i>
                <h5>Tile Adhesive</h5>
            </div>
            <div class="folder-card" onclick="window.open('water-proof.html', '_blank')">
                <i class="fas fa-droplet"></i>
                <h5>Water Proof</h5>
            </div>
            <div class="folder-card" onclick="window.open('shield-x.html', '_blank')">
                <i class="fas fa-shield-halved"></i>
                <h5>H4 ShieldX</h5>
            </div>
        </div>

        <div>
            <img src="bag.blueandred.png" class="hero-img">
            <img src="bag.purpleandyellow.png" class="hero-img">
        </div>
    </div>

    <div id="contact" class="content-section">
        <h2>Contact Us</h2>
        <div class="order-form-container mt-4 text-center">
            <p><i class="fa fa-phone me-2"></i> Call: +917907344030</p>
            <p><i class="fab fa-whatsapp me-2"></i> Whatsapp: 9745838382</p>
            <p><i class="fa fa-envelope me-2"></i> Email: avchemtirur@gmail.com</p>
            <hr>
            <h5>Address</h5>
            <p>AV Chem Chemical & Manufacturing<br>Mukkilapeedika, Kannamkulam PO,<br>BP Angadi, Tirur, Malappuram - 676102</p>
        </div>
    </div>

    <div id="dealer" class="content-section">
        <h2>Order Sheet</h2>
        <div class="order-form-container">
            <form id="orderForm">
                <div class="form-group">
                    <label>പേര്</label>
                    <input type="text" id="name" class="form-control required-field">
                </div>
                <div class="form-group">
                    <label>വിലാസം</label>
                    <textarea id="address" class="form-control required-field"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>City</label>
                        <input type="text" id="city" class="form-control required-field">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Land Mark</label>
                        <input type="text" id="landmark" class="form-control required-field">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>District</label>
                        <input type="text" id="dist" class="form-control required-field">
                    </div>
                    <div class="col-md-6 form-group">
                        <label>State</label>
                        <input type="text" id="state" class="form-control required-field">
                    </div>
                </div>
                <div class="form-group">
                    <label>മൊബൈൽ (10 Digits)</label>
                    <input type="tel" id="mobile" maxlength="10" inputmode="numeric" class="form-control required-field" oninput="validatePhone(this)">
                </div>
                <div id="whatsapp_option" class="form-group" style="display:none;">
                    <label>Next WhatsApp Number (Optional)</label>
                    <input type="tel" id="whatsapp" maxlength="10" inputmode="numeric" class="form-control">
                </div>
                <div class="form-group">
                    <label>പിൻ‌കോഡ് (6 Digits)</label>
                    <input type="tel" id="pincode" maxlength="6" inputmode="numeric" class="form-control required-field" oninput="validatePin(this)">
                </div>

                <div class="form-group">
                    <label>Product Select</label>
                    <select id="product_type" class="form-control" onchange="toggleProductFields()">
                        <option value="">--തിരഞ്ഞെടുക്കുക--</option>
                        <option value="tile">Tile Adhesive</option>
                        <option value="waterproof">Water Proof</option>
                        <option value="shieldx">H4 ShieldX</option>
                    </select>
                </div>

                <div id="dynamic_fields"></div>

                <div class="form-group mt-3">
                    <label>Quantity</label>
                    <input type="tel" id="qty" inputmode="numeric" class="form-control required-field">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-confirm" onclick="confirmOrder()">Confirm</button>
                    <button type="reset" class="btn btn-cancel" onclick="showSection('home')">Cancel</button>
                </div>
                <button type="button" class="btn btn-success w-100 mt-2" onclick="sharePage()"><i class="fa fa-share-alt"></i> Share</button>
            </form>
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
        }

        function validatePhone(input) {
            input.value = input.value.replace(/\D/g, '');
            if(input.value.length === 10) {
                input.classList.remove('is-invalid');
                document.getElementById('whatsapp_option').style.display = 'block';
            } else {
                input.classList.add('is-invalid');
            }
        }

        function validatePin(input) {
            input.value = input.value.replace(/\D/g, '');
            input.classList.toggle('is-invalid', input.value.length !== 6);
        }

        function toggleProductFields() {
            const type = document.getElementById('product_type').value;
            const container = document.getElementById('dynamic_fields');
            container.innerHTML = '';

            if(type === 'tile') {
                container.innerHTML = `
                    <label>ചെയ്യേണ്ട സ്ഥലം</label>
                    <select id="sub_place" class="form-control mb-2" onchange="showSubOptions('tile')">
                        <option value="">--Select--</option>
                        <option value="Home">Home</option>
                        <option value="Office">Office</option>
                        <option value="Shop">Shop</option>
                        <option value="Building">Building</option>
                        <option value="Other">Other</option>
                    </select>
                    <div id="sub_options"></div>
                `;
            } else if(type === 'waterproof') {
                container.innerHTML = `
                    <label>ചെയ്യേണ്ട സ്ഥലം</label>
                    <select id="sub_place" class="form-control" onchange="showSubOptions('water')">
                        <option value="">--Select--</option>
                        <option value="Home">Home</option>
                        <option value="Building">Building</option>
                        <option value="Other">Other</option>
                    </select>
                    <div id="sub_options"></div>
                `;
            }
        }

        function showSubOptions(cat) {
            const sub = document.getElementById('sub_options');
            if(cat === 'tile') {
                sub.innerHTML = `
                    <label>മെറ്റീരിയൽ</label>
                    <select id="final_choice" class="form-control">
                        <option value="Marble">Marble</option>
                        <option value="Granite">Granite</option>
                        <option value="Marbonit">Marbonit</option>
                        <option value="Ceramic Tile">Ceramic Tile</option>
                        <option value="Other">Other</option>
                    </select>
                `;
            } else {
                sub.innerHTML = `<input type="text" id="final_choice" placeholder="Specify more details" class="form-control mt-2">`;
            }
        }

        function confirmOrder() {
            let isValid = true;
            document.querySelectorAll('.required-field').forEach(field => {
                if(!field.value || field.classList.contains('is-invalid')) {
                    field.classList.add('is-invalid');
                    isValid = false;
                } else {
                    field.classList.remove('is-invalid');
                }
            });

            if(!isValid) { alert("ദയവായി എല്ലാ കളങ്ങളും ചുവന്ന അടയാളം ഇല്ലാതെ പൂരിപ്പിക്കുക."); return; }

            const msg = `*New Dealer Enquiry - AV Chem*%0A
Name: ${document.getElementById('name').value}%0A
Address: ${document.getElementById('address').value}%0A
Mobile: ${document.getElementById('mobile').value}%0A
Pincode: ${document.getElementById('pincode').value}%0A
Product: ${document.getElementById('product_type').value}%0A
Qty: ${document.getElementById('qty').value}`;

            // Send to Admin
            window.open(`https://wa.me/919745838382?text=${msg}`);
            
            // Send to Customer (if whatsapp added)
            const custWA = document.getElementById('whatsapp').value || document.getElementById('mobile').value;
            setTimeout(() => {
                window.open(`https://wa.me/91${custWA}?text=Thank you for your inquiry with AV Chem. We will contact you soon.`);
            }, 2000);
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({ title: 'AV Chem', text: 'Quality Chemical Solutions', url: window.location.href });
            } else { alert("Sharing not supported in this browser"); }
        }
    </script>
</body>
</html>
