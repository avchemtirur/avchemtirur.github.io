<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive & Waterproof | Avchem Chemical</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center,#0f2027 0%,transparent 40%),
    radial-gradient(circle at left,#1a2980 0%,transparent 55%),
    radial-gradient(circle at right,#7b4397 0%,transparent 55%),
    #000;
  z-index:-1;
}

/* NAV */
nav{
  height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
}
nav button{
  background:none;
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* PAGES */
.page{
  display:none;
  height:calc(100vh - 60px);
  padding:20px;
}
.page.active{display:block}

/* HERO */
.hero{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.hero h1{
  font-size:42px;
  animation:fadeUp 1.2s ease;
}
.hero p{
  margin-top:10px;
  opacity:.8;
  animation:fadeUp 1.8s ease;
}

/* ANIMATION */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* FOLDERS */
.folders{
  display:flex;
  gap:28px;
  margin-top:40px;
}
.folder{
  width:150px;
  height:110px;
  border-radius:16px;
  background:linear-gradient(135deg,#3a7bd5,#00d2ff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:15px;
  cursor:pointer;
  transition:.35s;
}
.folder:hover{
  transform:scale(1.12);
  box-shadow:0 0 25px #00d2ff;
}

/* DEALER FORM */
.form-box{
  max-width:420px;
  margin:auto;
  background:#111827;
  padding:20px;
  border-radius:18px;
}
input,select{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  border-radius:10px;
  border:none;
}
.form-actions{
  display:flex;
  gap:12px;
}
.form-actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
.confirm{background:#25D366;color:#000}
.cancel{background:#7b4397;color:#fff}

/* CONTACT */
.contact-box{
  text-align:center;
  margin-top:40px;
}
.contact-box a{
  display:block;
  margin:10px 0;
  font-size:18px;
  color:#fff;
}

/* BACK */
.back{
  margin-top:20px;
  background:none;
  border:1px solid #fff;
  color:#fff;
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
}

@media(max-width:768px){
  body{overflow:auto}
  .folders{flex-direction:column}
}
</style>
</head>

<body>
<div class="bg"></div>

<!-- NAV -->
<nav>
  <button onclick="openPage('home')">Home</button>
  <button onclick="openPage('dealer')">Dealer Enquiry</button>
  <button onclick="openPage('contact')">Contact</button>
</nav>

<!-- HOME -->
<section class="page active hero" id="home">
  <h1>H4 Tile Adhesive & Waterproof</h1>
  <p>
    Avchem Chemical & Manufacturing<br><br>
    മുഖ്യാലപ്പീടിക, കന്നംകുളം PO<br>
    BP Angadi, Pin 676102<br>
    Tirur, Kerala
  </p>

  <div class="folders">
    <div class="folder" onclick="openWhatsApp('Tile Adhesive')">Tile Adhesive</div>
    <div class="folder" onclick="openWhatsApp('Waterproof')">Waterproof</div>
    <div class="folder" onclick="openWhatsApp('H4 ShieldX')">H4 ShieldX</div>
  </div>
</section>

<!-- DEALER -->
<section class="page" id="dealer">
  <div class="form-box">
    <h2 style="text-align:center">Dealer Enquiry</h2>

    <input id="name" placeholder="Customer Name">
    <input id="city" placeholder="City">
    <input id="mobile" placeholder="Mobile Number">
    <input id="whatsapp" placeholder="WhatsApp Number (optional)">
    <input id="dist" placeholder="District">
    <input id="state" placeholder="State">

    <select id="product">
      <option>Tile Adhesive</option>
      <option>Waterproof</option>
      <option>H4 ShieldX</option>
    </select>

    <input id="qty" placeholder="Quantity (Bag / Kg)">

    <div class="form-actions">
      <button class="confirm" onclick="sendWA('CONFIRM')">Confirm</button>
      <button class="cancel" onclick="sendWA('CANCEL')">Cancel</button>
    </div>

    <button class="back" onclick="openPage('home')">Back</button>
  </div>
</section>

<!-- CONTACT -->
<section class="page" id="contact">
  <div class="contact-box">
    <a href="tel:+917907344030">📞 +91 79073 44030</a>
    <a href="https://wa.me/919745838382">💬 WhatsApp: +91 97458 38382</a>
    <a href="mailto:avchemtirur@gmail.com">✉️ avchemtirur@gmail.com</a>
    <button class="back" onclick="openPage('home')">Back</button>
  </div>
</section>

<script>
function openPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openWhatsApp(product){
  window.open(
    `https://wa.me/919745838382?text=Enquiry for ${product}`,
    '_blank'
  );
}

function sendWA(type){
  let msg =
`Dealer Enquiry (${type})
Name: ${name.value}
City: ${city.value}
Mobile: ${mobile.value}
WhatsApp: ${whatsapp.value}
District: ${dist.value}
State: ${state.value}
Product: ${product.value}
Quantity: ${qty.value}`;

  window.open(
    `https://wa.me/919745838382?text=${encodeURIComponent(msg)}`,
    '_blank'
  );
}
</script>
</body>
</html>
