<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

/* ===== BACKGROUND (IMAGE STYLE) ===== */
body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 70% 30%, rgba(0,255,255,0.18), transparent 45%),
    radial-gradient(circle at 30% 70%, rgba(0,180,180,0.22), transparent 45%),
    linear-gradient(135deg, #020b0e, #03161a, #020b0e);
}

/* ===== MENU ===== */
.menu{
  display:flex;
  justify-content:flex-end;
  gap:20px;
  padding:18px;
  font-size:18px;
}
.menu span{cursor:pointer;opacity:.85;}
.menu span:hover{opacity:1;}

/* ===== SECTIONS ===== */
.section{display:none;padding:40px 15px;text-align:center;}
.show{display:block;}

h1{font-size:34px;margin-bottom:10px;}
.tagline{color:#22e6d3;margin-bottom:30px;font-size:18px;}

/* ===== HOME BOXES ===== */
.box-row{
  display:flex;
  justify-content:center;
  gap:16px;
}
.box{
  width:95px;
  height:95px;
  border:2px solid #22e6d3;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:14px;
}

/* ===== FORM ===== */
input, select{
  width:100%;
  max-width:340px;
  padding:14px;
  margin:10px auto;
  border-radius:10px;
  border:none;
  font-size:16px;
  display:block;
}
.error{
  border:2px solid red !important;
}

.btn{
  width:150px;
  padding:14px;
  margin:12px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
}
.confirm{background:#1ecf72;color:#000;}
.cancel{background:#e00000;color:#fff;}

a{
  color:#22e6d3;
  display:block;
  margin:12px 0;
  font-size:18px;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="menu">
  <span onclick="show('home')">Home</span>
  <span onclick="show('dealer')">Dealer Enquiry</span>
  <span onclick="show('contact')">Contact</span>
</div>

<!-- HOME -->
<div id="home" class="section show">
  <h1>H4 Tile Adhesive & Waterproof</h1>
  <div class="tagline">Molecular Bonding. Peaceful Dwelling...</div>

  <div class="box-row">
    <div class="box">Tile<br>Adhesive</div>
    <div class="box">Waterproof</div>
    <div class="box">H4<br>ShieldX</div>
  </div>
</div>

<!-- DEALER ENQUIRY -->
<div id="dealer" class="section">
  <h1>Dealer Enquiry</h1>

  <input id="name" placeholder="Customer Name">

  <input id="mobile" placeholder="Mobile Number"
         maxlength="10" oninput="validateMobile()">

  <select id="product">
    <option value="">Select Product</option>
    <option>Tile Adhesive</option>
    <option>Waterproof</option>
    <option>H4 ShieldX</option>
  </select>

  <select id="qtyType">
    <option value="">Select Quantity Type</option>
    <option>Kg</option>
    <option>Bag</option>
    <option>20kg Bag</option>
    <option>40kg Bag</option>
  </select>

  <button class="btn confirm" onclick="sendWA()">Confirm</button>
  <button class="btn cancel" onclick="show('home')">Cancel</button>
</div>

<!-- CONTACT -->
<div id="contact" class="section">
  <h1>Contact</h1>
  <a href="tel:+917907344030">📞 +91 79073 44030</a>
  <a href="https://wa.me/919745838382">💬 WhatsApp 9745838382</a>
  <a href="mailto:avchemtirur@gmail.com">✉️ avchemtirur@gmail.com</a>
</div>

<script>
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}

function validateMobile(){
  const m=document.getElementById("mobile");
  if(m.value.length!==10){
    m.classList.add("error");
  }else{
    m.classList.remove("error");
  }
}

function sendWA(){
  const m=document.getElementById("mobile");
  if(m.value.length!==10){
    m.classList.add("error");
    alert("Enter valid 10 digit mobile number");
    return;
  }

  const msg=encodeURIComponent(
    "Dealer Enquiry\n"+
    "Name: "+document.getElementById("name").value+"\n"+
    "Mobile: "+m.value+"\n"+
    "Product: "+document.getElementById("product").value+"\n"+
    "Quantity: "+document.getElementById("qtyType").value
  );

  window.open("https://wa.me/919745838382?text="+msg,"_blank");
}
</script>

</body>
</html>
