<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem Chemical | H4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b0b16;
  --card:#14142b;
  --purple:#8a4bff;
  --blue:#2979ff;
  --error:#ff3b3b;
  --grey:#cfcfcf;
}

*{box-sizing:border-box;font-family:Segoe UI, sans-serif;}
body{
  margin:0;
  background:radial-gradient(circle at top, #2a0f45, #060612);
  color:#fff;
}

/* TOP BAR */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}
header img{height:40px}
nav button{
  background:none;
  border:none;
  color:white;
  font-size:16px;
  margin-left:20px;
  cursor:pointer;
}
nav button:hover{color:var(--purple)}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
}
.hero h1{
  font-size:38px;
  background:linear-gradient(90deg,#b388ff,#ffffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* FOLDERS */
.folders{
  display:flex;
  gap:20px;
  padding:40px;
  justify-content:center;
}
.folder{
  background:linear-gradient(180deg,#1a1a3a,#0f0f22);
  padding:30px;
  width:260px;
  border-radius:20px;
  cursor:pointer;
  text-align:center;
}
.folder:hover{outline:2px solid var(--purple)}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  overflow:auto;
}
.modal-content{
  background:#11112a;
  max-width:600px;
  margin:40px auto;
  padding:25px;
  border-radius:20px;
}
label{display:block;margin-top:15px}
input,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:5px;
}
.error{border:2px solid var(--error)}

.buttons{
  display:flex;
  gap:15px;
  margin-top:25px;
}
.confirm{
  background:var(--blue);
  color:white;
  flex:1;
  border:none;
  padding:12px;
  border-radius:10px;
}
.cancel{
  background:var(--grey);
  flex:1;
  border:none;
  padding:12px;
  border-radius:10px;
}

/* CONTACT PAGE */
.contact-box{
  text-align:center;
  padding:60px;
}

</style>
</head>

<body>

<header>
  <img src="av.logo.png" alt="AV Logo">
  <nav>
    <button onclick="openHome()">Home</button>
    <button onclick="openDealer()">Dealer Enquiry</button>
    <button onclick="openContact()">Contact</button>
  </nav>
</header>

<div class="hero">
  <h1>H4 Tile Adhesive & Waterproof Solutions</h1>
</div>

<div class="folders">
  <div class="folder" onclick="openProduct('Tile Adhesive')">Tile Adhesive</div>
  <div class="folder" onclick="openProduct('Waterproof')">Waterproof</div>
  <div class="folder" onclick="openProduct('H4 ShieldX')">H4 ShieldX</div>
</div>

<!-- DEALER ENQUIRY MODAL -->
<div class="modal" id="dealerModal">
<div class="modal-content">
<h2>Dealer Enquiry / Order Sheet</h2>

<label>Name<input id="name"></label>
<label>Address<input id="address"></label>
<label>City<input id="city"></label>
<label>Landmark<input id="landmark"></label>
<label>District<input id="dist"></label>
<label>State<input id="state"></label>

<label>Mobile
<input id="mobile" type="tel" inputmode="numeric" maxlength="10">
</label>

<label>WhatsApp Number
<input id="whatsapp" type="tel" inputmode="numeric" maxlength="10">
</label>

<label>Pincode
<input id="pincode" type="tel" inputmode="numeric" maxlength="6">
</label>

<label>Product
<select id="product">
<option value="">Select</option>
<option>Tile Adhesive</option>
<option>Waterproof</option>
<option>H4 ShieldX</option>
</select>
</label>

<label>Tile Adhesive Location
<select id="tilePlace">
<option value="">Select</option>
<option>Home</option>
<option>Office</option>
<option>Shop</option>
<option>Building</option>
<option>Other</option>
</select>
</label>

<label>Tile Type
<select id="tileType">
<option value="">Select</option>
<option>Marble</option>
<option>Granite</option>
<option>Marbonit</option>
<option>Ceramic Tile</option>
<option>Other</option>
</select>
</label>

<label>Waterproof Location
<select id="waterPlace">
<option value="">Select</option>
<option>Home</option>
<option>Building</option>
<option>Other</option>
</select>
</label>

<label>Quantity
<input id="qty" type="tel" inputmode="numeric">
</label>

<div class="buttons">
<button class="confirm" onclick="submitForm()">Confirm</button>
<button class="cancel" onclick="closeDealer()">Cancel</button>
</div>

</div>
</div>

<!-- CONTACT -->
<div class="modal" id="contactModal">
  <div class="modal-content contact-box">
    <h2>Contact</h2>
    <p>AV Chem Chemical & Manufacturing<br>
    Kannamkulam, Tirur<br>
    Malappuram, Kerala</p>
    <button class="confirm" onclick="closeContact()">Close</button>
  </div>
</div>

<script>
function openDealer(){document.getElementById('dealerModal').style.display='block'}
function closeDealer(){document.getElementById('dealerModal').style.display='none'}
function openContact(){document.getElementById('contactModal').style.display='block'}
function closeContact(){document.getElementById('contactModal').style.display='none'}
function openHome(){location.reload()}
function openProduct(p){window.open('', '_blank').document.write('<h1>'+p+'</h1>')}

function submitForm(){
  let fields=['name','address','city','dist','state','mobile','whatsapp','pincode','product','tilePlace','tileType','waterPlace','qty'];
  let valid=true;

  fields.forEach(id=>{
    let el=document.getElementById(id);
    el.classList.remove('error');
    if(!el.value){el.classList.add('error');valid=false;}
  });

  if(!valid){alert('Please fill all fields');return;}

  let msg=`H4 Order\nName:${name.value}\nMobile:${mobile.value}\nProduct:${product.value}\nQty:${qty.value}`;
  window.open(`https://wa.me/9745838382?text=${encodeURIComponent(msg)}`);
  window.open(`https://wa.me/${whatsapp.value}?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
