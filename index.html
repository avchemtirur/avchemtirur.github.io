<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H4 Tile Adhesive & Waterproof | Avchem Chemical</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Poppins,sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
}

/* BACKGROUND VIDEO STYLE */
.bg{
  position:fixed;
  inset:0;
  background:
   radial-gradient(circle at left,#7a1fa2,transparent 55%),
   radial-gradient(circle at right,#1e3cff,transparent 55%),
   #000;
  z-index:-1;
}

/* NAV */
nav{
  height:60px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:32px;
  padding-bottom:10px;
}
nav button{
  background:none;
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* PAGES */
.page{
  display:none;
  height:calc(100vh - 60px);
  padding:20px;
}
.page.active{display:block}

/* HOME */
.home{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* TEXT ANIMATION */
.title{
  font-family:'Playfair Display',serif;
  font-size:44px;
  animation:fadeUp 1.2s ease;
}
.subtitle{
  margin-top:10px;
  opacity:.85;
  animation:fadeUp 1.8s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* FOLDERS */
.folders{
  margin-top:40px;
  display:flex;
  gap:26px;
}
.folder{
  width:140px;
  height:100px;
  border-radius:14px;
  background:linear-gradient(135deg,#9b2cff,#4a5cff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:14px;
  cursor:pointer;
  transition:.3s;
}
.folder:hover{transform:scale(1.08)}

/* DEALER FORM */
.form-box{
  max-width:420px;
  margin:auto;
  background:#141428;
  padding:20px;
  border-radius:18px;
}
input,select{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  border-radius:10px;
  border:none;
}
.form-actions{
  display:flex;
  gap:12px;
}
.form-actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
}
.confirm{background:#25D366;color:#000}
.cancel{background:#9b2cff;color:#fff}

/* CONTACT */
.contact-box{
  text-align:center;
  margin-top:40px;
}
.contact-box a{
  display:block;
  margin:10px 0;
  color:#fff;
  font-size:18px;
}

/* BACK BUTTON */
.back{
  margin-top:20px;
  background:none;
  border:1px solid #fff;
  color:#fff;
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
}

@media(max-width:768px){
  body{overflow:auto}
  .folders{flex-direction:column}
}
</style>
</head>

<body>
<div class="bg"></div>

<!-- NAV -->
<nav>
  <button onclick="openPage('home')">Home</button>
  <button onclick="openPage('dealer')">Dealer Enquiry</button>
  <button onclick="openPage('contact')">Contact</button>
</nav>

<!-- HOME -->
<section class="page home active" id="home">
  <div class="title">H4 Tile Adhesive & Waterproof</div>
  <div class="subtitle">
    Avchem Chemical & Manufacturing<br><br>
    മുഖ്യാലപ്പീടിക, കന്നംകുളം PO<br>
    BP Angadi, Pin 676102<br>
    Tirur, Kerala
  </div>

  <div class="folders">
    <div class="folder" onclick="openWhatsApp('Tile Adhesive')">Tile Adhesive</div>
    <div class="folder" onclick="openWhatsApp('Waterproof')">Waterproof</div>
    <div class="folder" onclick="openWhatsApp('H4 ShieldX')">H4 ShieldX</div>
  </div>
</section>

<!-- DEALER -->
<section class="page" id="dealer">
  <div class="form-box">
    <h2 style="text-align:center">Dealer Enquiry</h2>

    <input id="name" placeholder="Customer Name">
    <input id="city" placeholder="City">
    <input id="mobile" placeholder="Mobile Number">
    <input id="whatsapp" placeholder="WhatsApp Number (optional)">
    <input id="dist" placeholder="District">
    <input id="state" placeholder="State">

    <select id="product">
      <option>Tile Adhesive</option>
      <option>Waterproof</option>
      <option>H4 ShieldX</option>
    </select>

    <input id="qty" placeholder="Quantity (Bag / Kg)">

    <div class="form-actions">
      <button class="confirm" onclick="sendWhatsApp('CONFIRM')">Confirm</button>
      <button class="cancel" onclick="sendWhatsApp('CANCEL')">Cancel</button>
    </div>

    <button class="back" onclick="openPage('home')">Back</button>
  </div>
</section>

<!-- CONTACT -->
<section class="page" id="contact">
  <div class="contact-box">
    <a href="tel:+917907344030">📞 +91 79073 44030</a>
    <a href="https://wa.me/919745838382" target="_blank">💬 WhatsApp: +91 97458 38382</a>
    <a href="mailto:avchemtirur@gmail.com">✉️ avchemtirur@gmail.com</a>
    <button class="back" onclick="openPage('home')">Back</button>
  </div>
</section>

<script>
function openPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openWhatsApp(product){
  window.open(
    `https://wa.me/919745838382?text=Enquiry for ${product}`,
    '_blank'
  );
}

function sendWhatsApp(type){
  let msg =
`Dealer Enquiry (${type})
Name: ${name.value}
City: ${city.value}
Mobile: ${mobile.value}
WhatsApp: ${whatsapp.value}
District: ${dist.value}
State: ${state.value}
Product: ${product.value}
Quantity: ${qty.value}`;

  window.open(
    `https://wa.me/919745838382?text=${encodeURIComponent(msg)}`,
    '_blank'
  );
}
</script>
</body>
</html>
