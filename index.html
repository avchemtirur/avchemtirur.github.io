<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem Chemical & Manufacturing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Segoe UI,Arial;background:#f4f6f8}
header{background:#0f2a44;color:#fff;padding:15px}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
nav button{background:#1e4f8a;color:#fff;border:none;padding:10px 18px;
border-radius:6px;font-size:16px;margin:5px;cursor:pointer}
nav button:hover{background:#163c6a}

.logo-text{
font-family:'Pacifico',cursive;
font-size:28px;
}

.section{padding:30px;text-align:center}

.folder{
width:260px;
background:#fff;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
padding:20px;
cursor:pointer;
transition:.3s;
}
.folder:hover{transform:translateY(-8px)}
.folder img{width:100%;border-radius:10px}

.flex{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}

.float{
animation:float 3s ease-in-out infinite;
}
@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-12px)}
}

.modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.7)
}
.modal-box{
background:#fff;max-width:420px;margin:5% auto;
padding:20px;border-radius:10px
}
input,select{
width:100%;padding:10px;margin:6px 0;font-size:16px
}
.btn{padding:10px 18px;border:none;border-radius:6px;cursor:pointer}
.confirm{background:#28a745;color:#fff}
.cancel{background:#aaa;color:#fff}
</style>
</head>

<body>

<header>
<nav>
<div class="logo-text">AV Chem Chemical & Manufacturing</div>
<div>
<button onclick="showHome()">Home</button>
<button onclick="showContact()">Contact</button>
<button onclick="openDealer()">Dealer Enquiry</button>
</div>
</nav>
</header>

<!-- HOME -->
<div class="section" id="home">
<img src="https://ibb.co/W4GPYTMv" width="120"><br><br>
<b>Mukkilapeedika Kannamkulam PO BP Angadi</b><br>
Pin: 676102 | Tirur | Malappuram | Kerala
</div>

<!-- PRODUCT FOLDERS -->
<div class="section flex">
<div class="folder" onclick="openPage('tile.html')">
<img src="https://ibb.co/VWsm4462">
<h3>Tile Adhesive</h3>
</div>

<div class="folder" onclick="openPage('water.html')">
<img src="https://ibb.co/yFKQFBmC">
<h3>Water Proof</h3>
</div>

<div class="folder" onclick="openPage('h4.html')">
<img src="https://ibb.co/k26cKq3j">
<h3>H4 ShieldX</h3>
</div>
</div>

<!-- BAG IMAGES -->
<div class="section flex">
<img src="https://ibb.co/gbQXZkh7" class="float" width="180">
<img src="https://ibb.co/20Sy223d" class="float" width="180">
</div>

<!-- CONTACT -->
<div class="section" id="contact" style="display:none">
<h2>Contact</h2>
📞 +91 79073 44030<br>
💬 WhatsApp: +91 9745838382<br>
✉️ avchemtirur@gmail.com
</div>

<!-- DEALER MODAL -->
<div class="modal" id="dealer">
<div class="modal-box">
<h3>Order Sheet</h3>
<input placeholder="Name">
<input placeholder="Address">
<input placeholder="City">
<input type="number" placeholder="Pincode">
<input placeholder="District">
<input placeholder="State">
<input type="number" placeholder="Contact Number">

<select id="product">
<option>Tile Adhesive</option>
<option>Water Proof</option>
<option>H4 ShieldX</option>
</select>

<input type="number" placeholder="Quantity (Sq Ft)">

<div style="text-align:center;margin-top:10px">
<button class="btn confirm" onclick="sendWA()">Confirm</button>
<button class="btn cancel" onclick="closeDealer()">Cancel</button>
</div>
</div>
</div>

<script>
function showHome(){
document.getElementById("home").style.display="block"
document.getElementById("contact").style.display="none"
}
function showContact(){
document.getElementById("home").style.display="none"
document.getElementById("contact").style.display="block"
}
function openDealer(){
document.getElementById("dealer").style.display="block"
}
function closeDealer(){
document.getElementById("dealer").style.display="none"
}
function openPage(p){
window.open(p,"_blank")
}
function sendWA(){
let msg="New Order from AV Chem";
window.open("https://wa.me/919745838382?text="+encodeURIComponent(msg))
closeDealer()
}
</script>

</body>
</html>
