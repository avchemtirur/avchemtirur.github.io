<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem Chemical & Manufacturing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#0b1218;
  color:#fff;
}

/* NAVBAR */
.navbar{
  position:absolute;
  top:0;
  width:100%;
  padding:18px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}

/* BRAND NAME WITH LEFT GAP */
.navbar .brand{
  font-size:18px;
  font-weight:500;
  padding-left:4rem;   /* 👈 4 space gap from left */
}

.navbar a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  font-size:13px;
  opacity:.85;
}

/* HERO BACKGROUND */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  position:relative;
  overflow:hidden;
}

/* BLUE LAYERS */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,
    transparent 0%,
    #1c6fa1 40%,
    transparent 70%);
  opacity:.8;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(-135deg,
    transparent 0%,
    #0b4f6c 40%,
    transparent 70%);
  opacity:.7;
}

/* MAIN CARD (ONLY LEFT CONTENT) */
.container{
  max-width:1100px;
  width:100%;
  background:#1a232c;
  border-radius:18px;
  padding:60px;
  position:relative;
  z-index:2;
}

/* CONTENT */
.container h1{
  font-size:36px;
  margin-bottom:14px;
}

.container p{
  font-size:14px;
  opacity:.85;
  line-height:1.6;
  max-width:480px;
}

.container .btn{
  display:inline-block;
  margin-top:24px;
  padding:10px 22px;
  background:#fff;
  color:#000;
  border-radius:20px;
  font-size:13px;
  text-decoration:none;
}

/* MOBILE */
@media(max-width:768px){
  .navbar .brand{
    padding-left:1.5rem;
    font-size:16px;
  }
  .container{
    padding:40px;
  }
  .container h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="brand">
    AV Chem Chemical & Manufacturing
  </div>
  <div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Service</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <h1>H4 Tile Adhesive & Waterproof</h1>
    <p>
      High bond strength tile adhesive and waterproof solutions  
      specially designed for Kerala climate conditions.
    </p>
    <a class="btn" href="#">Read More</a>
  </div>
</section>

</body>
</html>
