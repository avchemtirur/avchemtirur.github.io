<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Dealer Enquiry</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
h1,h2{text-align:center}

input,select{
  width:90%;
  padding:14px;
  margin:8px 0;
  font-size:18px;
  border-radius:6px;
  border:2px solid #ccc;
}
input:focus,select:focus{
  outline:none;
  border-color:#00ffff;
}
.error{
  border-color:red !important;
}

button{
  padding:14px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
.confirm{
  background:#00c853;
  color:#fff;
  display:none;
}
.back{
  background:#d50000;
  color:#fff;
  margin-top:20px;
}

.section{display:none;text-align:center;padding:20px}
.section.active{display:block}
</style>
</head>

<body>

<div id="dealer" class="section active">
<h1>Dealer Enquiry</h1>

<input id="name" placeholder="Customer Name" oninput="next(this,'city')">
<input id="city" placeholder="City" oninput="next(this,'mobile')">
<input id="mobile" placeholder="Mobile Number" oninput="next(this,'whatsapp')">
<input id="whatsapp" placeholder="WhatsApp Number" oninput="next(this,'district')">
<input id="district" placeholder="District" oninput="next(this,'state')">
<input id="state" placeholder="State" oninput="next(this,'pincode')">
<input id="pincode" placeholder="Pincode" oninput="next(this,'product')">

<select id="product" onchange="productChange()">
  <option value="">Select Product</option>
  <option>Tile Adhesive</option>
  <option>Waterproof</option>
  <option>H4 ShieldX</option>
</select>

<select id="usage" style="display:none" onchange="usageChange()"></select>
<input id="otherUsage" placeholder="Enter Other Usage" style="display:none">

<input id="quantity" placeholder="Quantity (Kg / Bag)">

<br>
<button class="confirm" id="confirmBtn" onclick="sendWhatsApp()">Confirm</button>
<br>
<button class="back" onclick="alert('Back pressed')">Back</button>
</div>

<script>
function next(el,id){
  document.getElementById(id)?.focus();
  validate();
}

function productChange(){
  let p=document.getElementById("product").value;
  let u=document.getElementById("usage");
  u.style.display="block";
  u.innerHTML="<option value=''>Select Usage</option>";
  let options=[];

  if(p==="Tile Adhesive")
    options=["Marble & Granite","Marbonite","Wall","Floor","Building","House","Other"];
  if(p==="Waterproof")
    options=["Bathroom","House","Building","Store","Hotel","Other"];
  if(p==="H4 ShieldX")
    options=["Bathroom","Hall","Room","Building","Store","Hotel","Other"];

  options.forEach(o=>{
    u.innerHTML+=`<option>${o}</option>`;
  });
}

function usageChange(){
  let u=document.getElementById("usage").value;
  document.getElementById("otherUsage").style.display=
    (u==="Other")?"block":"none";
}

function validate(){
  let req=["mobile","quantity"];
  let ok=true;
  req.forEach(id=>{
    let el=document.getElementById(id);
    if(!el.value){
      el.classList.add("error");
      ok=false;
    }else el.classList.remove("error");
  });
  document.getElementById("confirmBtn").style.display= ok?"inline-block":"none";
}

function sendWhatsApp(){
  alert("Thank you! Your enquiry is being sent.");
  let msg=
`H4 Dealer Enquiry
Name: ${name.value}
City: ${city.value}
Mobile: ${mobile.value}
Product: ${product.value}
Usage: ${usage.value || otherUsage.value}
Quantity: ${quantity.value}`;

  window.open(
   "https://wa.me/919745838382?text="+encodeURIComponent(msg),
   "_blank"
  );
}
</script>

</body>
</html>
