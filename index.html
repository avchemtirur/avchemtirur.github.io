<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Tile Adhesive & Waterproof</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#000;color:#fff;overflow-x:hidden}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:12px;
}
.lang button{
  width:44px;height:44px;
  border-radius:50%;
  border:2px solid #00ffff;
  background:transparent;
  color:#00ffff;
  margin-bottom:6px;
}
.menu{
  text-align:right;
}
.menu div{
  font-size:18px;
  margin:6px 0;
  cursor:pointer;
}
.menu div:hover{color:#00ffff}

/* CENTER TITLE */
.center{text-align:center;margin-top:25px}
.center h1{
  font-size:32px;
  animation:titleAnim 1.5s ease;
}
@keyframes titleAnim{
  from{opacity:0;transform:scale(1.3)}
  to{opacity:1;transform:scale(1)}
}

/* SECTIONS */
.section{display:none;padding:20px;text-align:center}
#home{display:block}

/* HOME */
#home img{width:120px;margin:12px auto}
.address p{line-height:1.6}

/* FOLDERS */
.folders{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:25px;
}
.folder{
  width:95px;
  padding:16px 6px;
  border:2px solid #00ffff;
  border-radius:14px;
  cursor:pointer;
  transition:0.3s;
}
.folder:hover{
  transform:scale(1.08);
  background:rgba(0,255,255,0.1)
}

/* BAGS */
.bags{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:20px;
}
.bags img{
  width:110px;
  animation:float 3s infinite ease-in-out;
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

/* FORM */
input,select{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
.qtyBox{display:none}
button{
  padding:12px 26px;
  border:none;
  border-radius:25px;
  font-size:16px;
  margin:10px;
  cursor:pointer;
}
.confirm{background:#00c853;color:#fff}
.cancel{background:#d50000;color:#fff}

/* CONTACT */
.contactBox p{
  font-size:20px;
  margin:14px 0;
}
a{color:#00ffff;text-decoration:none}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="lang">
    <button onclick="setLang('en')">EN</button><br>
    <button onclick="setLang('ml')">ML</button>
  </div>
  <div class="menu">
    <div onclick="openSection('home')">Home</div>
    <div onclick="openSection('dealer')">Dealer Enquiry</div>
    <div onclick="openSection('contact')">Contact</div>
  </div>
</div>

<!-- TITLE -->
<div class="center">
  <h1 id="title">H4 Tile Adhesive & Waterproof</h1>
</div>

<!-- HOME -->
<div id="home" class="section">
  <img src="avlogo.png">
  <div class="address">
    <p><b>AV Chem Chemical & Manufacturing</b></p>
    <p>Mukkilapeedika</p>
    <p>Kannam Kulam</p>
    <p>PO BP Angadi</p>
    <p>Tirur, Malappuram</p>
    <p>Kerala, India</p>
  </div>

  <div class="folders">
    <div class="folder" onclick="folderOpen('Tile Adhesive')">Tile Adhesive</div>
    <div class="folder" onclick="folderOpen('Waterproof')">Waterproof</div>
    <div class="folder" onclick="folderOpen('H4 ShieldX')">H4 ShieldX</div>
  </div>

  <div class="bags">
    <img src="bag-yellow.png">
    <img src="bag-purple.png">
  </div>
</div>

<!-- DEALER ENQUIRY -->
<div id="dealer" class="section">
  <h2>Dealer Enquiry</h2>

  <input id="name" placeholder="Customer Name">
  <input id="city" placeholder="City">
  <input id="mobile" placeholder="Mobile Number">
  <input id="district" placeholder="District">
  <input id="state" placeholder="State">

  <select id="product">
    <option>Tile Adhesive</option>
    <option>Waterproof</option>
    <option>H4 ShieldX</option>
  </select>

  <select id="unit" onchange="showQty()">
    <option value="">Select Unit</option>
    <option value="Bag">Bag</option>
    <option value="KG">KG</option>
  </select>

  <div class="qtyBox" id="qtyBox">
    <input id="qty" type="number" min="1" max="1000000" placeholder="Enter Quantity">
  </div>

  <button class="confirm" onclick="sendWhatsApp()">Confirm</button>
  <button class="cancel" onclick="openSection('home')">Cancel</button>
</div>

<!-- CONTACT -->
<div id="contact" class="section">
  <div class="contactBox">
    <p>📞 <a href="tel:+917907344030">+91 79073 44030</a></p>
    <p>💬 <a href="https://wa.me/919745838382">+91 97458 38382</a></p>
    <p>✉️ <a href="mailto:avchemtirur@gmail.com">avchemtirur@gmail.com</a></p>
  </div>
  <button class="cancel" onclick="openSection('home')">Back</button>
</div>

<script>
function openSection(id){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
}

function folderOpen(name){
  alert(name + " opened");
}

function showQty(){
  document.getElementById('qtyBox').style.display='block';
}

function sendWhatsApp(){
  let msg =
  "Dealer Enquiry%0A"+
  "Name: "+name.value+"%0A"+
  "City: "+city.value+"%0A"+
  "Mobile: "+mobile.value+"%0A"+
  "District: "+district.value+"%0A"+
  "State: "+state.value+"%0A"+
  "Product: "+product.value+"%0A"+
  "Quantity: "+qty.value+" "+unit.value;

  window.open("https://wa.me/919745838382?text="+msg);
}

function setLang(l){
  if(l==='ml'){
    title.innerText="H4 ടൈൽ അഡ്ഹേസീവ് & വാട്ടർപ്രൂഫ്";
  }else{
    title.innerText="H4 Tile Adhesive & Waterproof";
  }
}
</script>

</body>
</html>
