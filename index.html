<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem Chemical & Manufacturing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#070b10;
  color:#fff;
  overflow-x:hidden;
}

/* NAVBAR */
.nav{
  position:absolute;
  top:0;
  width:100%;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

.brand{
  font-family:'Great Vibes',cursive;
  font-size:32px;
  padding-left:4rem;
}

.nav a{
  color:#fff;
  margin-left:18px;
  font-size:13px;
  text-decoration:none;
  opacity:.8;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:120px 8%;
  position:relative;
}

/* GRADIENT BACKGROUND */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 55%, #9b3bd9 0%, transparent 45%),
    radial-gradient(circle at 75% 55%, #0a4cff 0%, transparent 45%),
    linear-gradient(135deg,#0c1420,#05080d);
  z-index:-1;
}

/* CONTENT */
.content{
  max-width:520px;
}

.content h1{
  font-size:48px;
  margin-bottom:18px;
}

.content p{
  font-size:15px;
  opacity:.85;
  line-height:1.7;
}

.buttons{
  margin-top:30px;
  display:flex;
  gap:16px;
}

.btn{
  padding:12px 28px;
  border-radius:30px;
  font-size:14px;
  text-decoration:none;
  color:#fff;
}

.primary{
  background:linear-gradient(135deg,#8c4bff,#b56bff);
}

.outline{
  border:1px solid #fff;
}

/* IMAGE AREA */
.images{
  position:absolute;
  right:6%;
  bottom:80px;
  display:flex;
  gap:30px;
}

.images img{
  width:230px;
  animation:float 4s ease-in-out infinite;
}

.images img:last-child{
  animation-delay:1.8s;
}

/* FLOAT ANIMATION */
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-18px)}
  100%{transform:translateY(0)}
}

/* ICON SECTION */
.features{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:14px;
}

.feature{
  background:rgba(255,255,255,.08);
  padding:12px 22px;
  border-radius:14px;
  font-size:13px;
  backdrop-filter:blur(6px);
}

/* MOBILE */
@media(max-width:768px){
  .hero{
    flex-direction:column;
    text-align:center;
  }

  .brand{
    padding-left:1.5rem;
    font-size:26px;
  }

  .images{
    position:relative;
    right:auto;
    bottom:auto;
    margin-top:40px;
  }

  .images img{
    width:170px;
  }

  .features{
    flex-direction:column;
    position:relative;
    margin-top:30px;
  }
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="brand">AV Chem Chemical & Manufacturing</div>
  <div>
    <a href="#">Home</a>
    <a href="#">Dealer Enquiry</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- HERO -->
<section class="hero">

  <!-- LEFT CONTENT -->
  <div class="content">
    <h1>H4 Tile Adhesive</h1>
    <p>
      Premium polymer modified tile adhesive & waterproof solutions.
      High bond strength, long-lasting durability, suitable for Kerala climate.
    </p>

    <div class="buttons">
      <a href="#" class="btn primary">Become a Dealer</a>
      <a href="tel:+917907344030" class="btn outline">Call Now</a>
    </div>
  </div>

  <!-- RIGHT IMAGES -->
  <div class="images">
    <!-- Replace src with your uploaded images -->
    <img src="h4-blue.png" alt="H4 Tile Adhesive">
    <img src="h4-purple.png" alt="H4 Waterproof">
  </div>

  <!-- BOTTOM ICONS -->
  <div class="features">
    <div class="feature">🧱 Tile Adhesive</div>
    <div class="feature">💧 Waterproof</div>
    <div class="feature">📞 +91 79073 44030</div>
  </div>

</section>

</body>
</html>
