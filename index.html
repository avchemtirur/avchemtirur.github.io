<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AV Chem Chemical | H4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
 --bg-main:#05040a;
 --bg-deep:#0b0716;
 --violet-dark:#1a0f2e;
 --violet-glow:#7c4dff;
 --violet-soft:#b388ff;
 --card-bg:rgba(30,20,55,0.65);
 --card-border:rgba(180,140,255,0.15);
 --text-main:#ffffff;
 --text-soft:#cfc7ff;
 --blue:#2979ff;
}

*{box-sizing:border-box}
body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 color:var(--text-main);
 background:
 radial-gradient(circle at 50% 25%, rgba(124,77,255,0.35), transparent 55%),
 linear-gradient(180deg,var(--bg-main),var(--bg-deep));
}

/* TOP BAR */
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:14px 22px;
 background:rgba(10,5,25,0.6);
 backdrop-filter:blur(14px);
}
nav button{
 background:none;border:none;
 color:var(--text-soft);
 margin-left:16px;
 font-size:15px;
}
nav button:hover{color:var(--violet-soft)}
.lang{
 border:1px solid var(--card-border);
 border-radius:20px;
 padding:4px 10px;
 font-size:12px;
}

/* HERO */
.hero{
 text-align:center;
 padding:90px 20px 60px;
}
.hero h1{
 font-size:38px;
 line-height:1.2;
 background:linear-gradient(90deg,var(--violet-soft),#ffffff);
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

/* CARDS */
.folders{
 display:flex;
 gap:18px;
 justify-content:center;
 padding:40px 20px 70px;
}
.folder{
 width:240px;
 padding:32px 18px;
 text-align:center;
 background:var(--card-bg);
 border-radius:22px;
 border:1px solid var(--card-border);
 backdrop-filter:blur(10px);
 box-shadow:0 20px 50px rgba(0,0,0,0.6);
 cursor:pointer;
}
.folder:hover{
 transform:translateY(-4px);
 box-shadow:0 0 40px rgba(124,77,255,0.45);
}

/* MODAL */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.85);
 overflow:auto;
}
.modal-content{
 background:linear-gradient(180deg,#120a25,#090513);
 max-width:600px;
 margin:30px auto;
 padding:26px;
 border-radius:22px;
 border:1px solid var(--card-border);
}
label{display:block;margin-top:14px}
input,select{
 width:100%;
 padding:11px;
 border-radius:10px;
 border:none;
 margin-top:6px;
}
.buttons{
 display:flex;
 gap:16px;
 margin-top:26px;
}
.confirm{
 flex:1;
 background:var(--blue);
 color:white;
 border:none;
 padding:13px;
 border-radius:12px;
}
.cancel{
 flex:1;
 background:#cfcfcf;
 border:none;
 padding:13px;
 border-radius:12px;
}

/* MOBILE */
@media(max-width:720px){
 .folders{flex-direction:column;align-items:center}
 .folder{width:90%}
 .hero h1{font-size:32px}
}
</style>
</head>

<body>

<header>
 <img src="av.logo.png" height="38">
 <nav>
  <button onclick="home()">Home</button>
  <button onclick="openDealer()">Dealer Enquiry</button>
  <button onclick="openContact()">Contact</button>
  <button class="lang">EN / ML</button>
 </nav>
</header>

<div class="hero">
 <h1>H4 Tile Adhesive & Waterproof Solutions</h1>
</div>

<div class="folders">
 <div class="folder">Tile Adhesive</div>
 <div class="folder">Waterproof</div>
 <div class="folder">H4 ShieldX</div>
</div>

</body>
</html>
