<!-- ================= H4 POPUPS & FORMS ================= -->

<style>
/* ---------- COMMON ---------- */
.h4-btn{background:#1f2937;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600}
.h4-btn:hover{background:#374151}
.h4-green{background:#22c55e;color:#000}
.h4-red{background:#ef4444}
.h4-purple{background:#8b5cf6}
.h4-modal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.85);z-index:9999;overflow:auto
}
.h4-box{
  background:#0f172a;color:#e5e7eb;
  max-width:820px;margin:40px auto;padding:22px;border-radius:14px
}
.h4-close{float:right;font-size:22px;cursor:pointer}
input,select,textarea{
  width:100%;padding:10px;margin:6px 0 12px;border-radius:8px;border:none
}
label{font-size:14px;color:#9ca3af}
.h4-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- MOBILE ---------- */
@media(max-width:600px){
  .h4-box{margin:15px}
}
</style>

<!-- ===== BUTTON FUNCTIONS (attach these to your existing buttons) ===== -->
<script>
/* ===== SETTINGS ===== */
const WA_NUMBER = "919745838382";
const CALL_NUMBER = "+917907344030";
let CURRENT_SECTION = "";

/* ===== OPENERS ===== */
function h4OpenLang(section){
  CURRENT_SECTION = section;
  document.getElementById("h4Lang").style.display="block";
}
function h4ShowContent(lang){
  document.getElementById("h4Lang").style.display="none";
  let c="";
  if(CURRENT_SECTION==="waterproof"){
    c = (lang==="ml") ? h4_wp_ml : h4_wp_en;
  }else{
    c = (lang==="ml") ? h4_bond_ml : h4_bond_en;
  }
  document.getElementById("h4ContentArea").innerHTML = c;
  document.getElementById("h4Content").style.display="block";
}
function h4OpenOrder(){document.getElementById("h4Order").style.display="block";}
function h4OpenDealer(){document.getElementById("h4Dealer").style.display="block";}
function h4Contact(){
  window.open("https://wa.me/"+WA_NUMBER,"_blank");
  window.location.href="tel:"+CALL_NUMBER;
}
function h4Close(id){document.getElementById(id).style.display="none";}

/* ===== WHATSAPP SEND ===== */
function h4SendOrder(confirm){
  let msg =
`CUSTOMER ORDER ${confirm?"CONFIRMED":"CANCELLED"}
Name: ${o_name.value}
Mobile: ${o_mobile.value}
Product: ${o_product.value}
Quantity: ${o_qty.value}
Remarks: ${o_remark.value}`;
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg));
  h4Close("h4Order");
  if(confirm) document.getElementById("h4Thanks").style.display="block";
}
function h4SendDealer(confirm){
  let msg =
`DEALER ENQUIRY ${confirm?"CONFIRMED":"CANCELLED"}
Name: ${d_name.value}
Phone: ${d_phone.value}
WhatsApp: ${d_whatsapp.value}
City: ${d_city.value}
Item: ${d_item.value}
Quantity: ${d_qty.value}`;
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg));
  h4Close("h4Dealer");
  if(confirm) document.getElementById("h4Thanks").style.display="block";
}
</script>

<!-- ===== LANGUAGE SELECT ===== -->
<div id="h4Lang" class="h4-modal">
  <div class="h4-box">
    <span class="h4-close" onclick="h4Close('h4Lang')">×</span>
    <h3>Select Language</h3>
    <button class="h4-btn" style="width:100%" onclick="h4ShowContent('ml')">മലയാളം</button><br><br>
    <button class="h4-btn" style="width:100%" onclick="h4ShowContent('en')">English</button>
  </div>
</div>

<!-- ===== CONTENT ===== -->
<div id="h4Content" class="h4-modal">
  <div class="h4-box">
    <span class="h4-close" onclick="h4Close('h4Content')">×</span>
    <div id="h4ContentArea"></div>
  </div>
</div>

<!-- ===== ORDER FORM ===== -->
<div id="h4Order" class="h4-modal">
  <div class="h4-box">
    <span class="h4-close" onclick="h4Close('h4Order')">×</span>
    <h3>Customer Order</h3>
    <input id="o_name" placeholder="Customer Name">
    <input id="o_mobile" placeholder="Mobile Number">
    <select id="o_product">
      <option>Tile Adhesive</option>
      <option>Waterproof</option>
    </select>
    <input id="o_qty" placeholder="Quantity">
    <textarea id="o_remark" placeholder="Remarks"></textarea>
    <div class="h4-actions">
      <button class="h4-btn h4-green" onclick="h4SendOrder(true)">Confirm</button>
      <button class="h4-btn h4-red" onclick="h4SendOrder(false)">Cancel</button>
    </div>
  </div>
</div>

<!-- ===== DEALER FORM ===== -->
<div id="h4Dealer" class="h4-modal">
  <div class="h4-box">
    <span class="h4-close" onclick="h4Close('h4Dealer')">×</span>
    <h3>Dealer Enquiry</h3>
    <input id="d_name" placeholder="Your Name">
    <input id="d_address" placeholder="Address">
    <input id="d_email" placeholder="Email">
    <input id="d_phone" placeholder="Contact Number">
    <input id="d_whatsapp" placeholder="WhatsApp Number">
    <input id="d_landmark" placeholder="Landmark (Optional)">
    <input id="d_pincode" placeholder="Pincode">
    <input id="d_city" placeholder="City">
    <input id="d_district" placeholder="District">
    <input id="d_state" placeholder="State">
    <select id="d_item">
      <option>Tile Adhesive</option>
      <option>Waterproof</option>
    </select>
    <input id="d_qty" placeholder="Quantity">
    <div class="h4-actions">
      <button class="h4-btn h4-green" onclick="h4SendDealer(true)">Confirm</button>
      <button class="h4-btn h4-red" onclick="h4SendDealer(false)">Cancel</button>
    </div>
  </div>
</div>

<!-- ===== THANK YOU ===== -->
<div id="h4Thanks" class="h4-modal">
  <div class="h4-box" style="text-align:center">
    <h2>🙏 Thank You</h2>
    <p>Your request has been sent successfully.</p>
    <button class="h4-btn" onclick="h4Close('h4Thanks')">Close</button>
  </div>
</div>
