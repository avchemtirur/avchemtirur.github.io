<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4 Tile Adhesive - Order Sheet</title>

<style>
:root{
  --yellow:#f1e311;
  --dark:#1a2a44;
  --error:#ff2e2e;
}

body{
  font-family:'Segoe UI','Meera',sans-serif;
  margin:0;
  background:#f4f4f4;
  border-left:15px solid var(--yellow);
  border-right:15px solid var(--yellow);
}

header{
  background:var(--yellow);
  padding:20px;
  text-align:center;
  position:sticky;
  top:0;
}

.header-title{
  background:#000;
  color:var(--yellow);
  padding:12px 35px;
  font-size:22px;
  font-weight:800;
  display:inline-block;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
  background:#fff;
}

h2{
  text-align:center;
  color:var(--dark);
}

.order-sheet{
  border:4px solid var(--yellow);
  padding:25px;
  border-radius:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.full{
  grid-column:span 2;
}

label{
  font-weight:700;
  margin-bottom:5px;
  color:var(--dark);
}

input,select{
  padding:12px;
  border:2px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--dark);
}

.invalid{
  border-color:var(--error)!important;
  background:#fff4f4;
}

.error-text{
  font-size:13px;
  color:var(--error);
  display:none;
}

.buttons{
  display:flex;
  gap:15px;
  margin-top:25px;
}

.confirm{
  flex:2;
  background:var(--dark);
  color:#fff;
  padding:18px;
  font-size:18px;
  font-weight:800;
  border:none;
  border-radius:10px;
}

.cancel{
  flex:1;
  background:#888;
  color:#fff;
  padding:18px;
  font-weight:700;
  border:none;
  border-radius:10px;
}

.share{
  display:none;
  margin-top:15px;
  background:#25D366;
  color:#fff;
  padding:14px;
  font-weight:800;
  border:none;
  border-radius:10px;
  width:100%;
}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:span 1}
}
</style>
</head>

<body>

<header>
  <div class="header-title">H4 TILE ADHESIVE</div>
</header>

<div class="container">
<h2>ORDER FORM / ഓർഡർ ഷീറ്റ്</h2>

<form id="orderForm" class="order-sheet" novalidate>

<div class="form-grid">

<div class="form-group full">
<label>പേര് / Name *</label>
<input id="name" required>
<span class="error-text">Name required</span>
</div>

<div class="form-group full">
<label>വിലാസം / Address *</label>
<input id="address" required>
<span class="error-text">Address required</span>
</div>

<div class="form-group">
<label>City *</label>
<input id="city" required>
</div>

<div class="form-group">
<label>Landmark *</label>
<input id="landmark" required>
</div>

<div class="form-group">
<label>Mobile (10 digit) *</label>
<input id="mobile" maxlength="10" inputmode="numeric" oninput="numOnly(this);syncWA()" required>
<span class="error-text">10 digit number required</span>
</div>

<div class="form-group">
<label>WhatsApp (optional)</label>
<input id="whatsapp" maxlength="10" inputmode="numeric" oninput="numOnly(this)">
<span class="error-text">Invalid number</span>
</div>

<div class="form-group">
<label>Pincode (6 digit) *</label>
<input id="pincode" maxlength="6" inputmode="numeric" oninput="numOnly(this)" required>
<span class="error-text">6 digit pincode required</span>
</div>

<div class="form-group">
<label>District *</label>
<input id="district" required>
</div>

<div class="form-group full">
<label>State *</label>
<input id="state" value="Kerala" required>
</div>

<div class="form-group full">
<label>Tile adhesive ചെയ്യേണ്ട സ്ഥലം *</label>
<select id="place" onchange="toggleSub()" required>
<option value="">Select</option>
<option>Home</option>
<option>Office</option>
<option>Shop</option>
<option>Building</option>
<option>Other</option>
</select>
</div>

<div class="form-group full" id="subBox" style="display:none">
<label>Work Type *</label>
<select id="workType" required>
<option value="">Select</option>
<option>Marble</option>
<option>Granite</option>
<option>Marbonite</option>
<option>Floor</option>
<option>Wall</option>
<option>Bathroom</option>
<option>Other</option>
</select>
</div>

<div class="form-group full">
<label>Quantity (1 – 1000000) *</label>
<input id="qty" type="number" min="1" max="1000000" inputmode="numeric" required>
</div>

</div>

<div class="buttons">
<button type="button" class="confirm" onclick="submitOrder()">CONFIRM</button>
<button type="reset" class="cancel">CANCEL</button>
</div>

<button type="button" class="share" id="shareBtn" onclick="shareOrder()">SHARE ORDER</button>

</form>
</div>

<script>
function numOnly(el){
 el.value=el.value.replace(/\D/g,'');
}

function syncWA(){
 if(mobile.value.length===10){
  whatsapp.value=mobile.value;
 }
}

function toggleSub(){
 subBox.style.display=place.value?'block':'none';
}

function submitOrder(){
 let valid=true;
 document.querySelectorAll('[required]').forEach(f=>{
  if(!f.value){
   f.classList.add('invalid');
   valid=false;
  }else{
   f.classList.remove('invalid');
  }
 });

 if(mobile.value.length!==10){mobile.classList.add('invalid');valid=false}
 if(whatsapp.value && whatsapp.value.length!==10){whatsapp.classList.add('invalid');valid=false}
 if(pincode.value.length!==6){pincode.classList.add('invalid');valid=false}

 if(!valid){
  alert("Please fill all required fields correctly");
  return;
 }

 let msg=`*H4 TILE ADHESIVE ORDER*
Name: ${name.value}
Address: ${address.value}
City: ${city.value}
Mobile: ${mobile.value}
Work: ${place.value} - ${workType.value}
Qty: ${qty.value}`;

 window.open(`https://wa.me/919745838382?text=${encodeURIComponent(msg)}`,'_blank');

 if(whatsapp.value){
  setTimeout(()=>{
   window.open(`https://wa.me/91${whatsapp.value}?text=${encodeURIComponent(msg)}`,'_blank');
  },800);
 }

 shareBtn.style.display='block';
}

function shareOrder(){
 navigator.share({
  title:'H4 Order',
  text:'H4 Tile Adhesive Order',
  url:location.href
 });
}
</script>

</body>
</html>
