<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4 Tile Adhesive - AV Chem Official</title>
    <style>
        :root {
            --primary-yellow: #f1e311;
            --dark-blue: #1a2a44;
            --accent-red: #d32f2f;
            --border-width: 15px;
            --error-red: #ff3333;
        }

        body {
            font-family: 'Segoe UI', 'Meera', sans-serif;
            margin: 0; padding: 0; line-height: 1.6;
            background-color: #fff;
            border-left: var(--border-width) solid var(--primary-yellow);
            border-right: var(--border-width) solid var(--primary-yellow);
        }

        header {
            background: var(--primary-yellow);
            padding: 25px 10px;
            text-align: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .lang-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .lang-btns button { padding: 10px 20px; border: 2px solid #333; cursor: pointer; font-weight: bold; border-radius: 5px; }
        
        .header-title-box {
            background: #000; color: var(--primary-yellow);
            display: inline-block; padding: 12px 30px;
            font-weight: bold; font-size: clamp(1.2rem, 5vw, 1.8rem);
            border-radius: 4px;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 30px 15px; }

        .hero-title-section { border-left: 6px solid var(--accent-red); padding: 10px 20px; margin-bottom: 40px; background: #fff5f5; }
        .hero-title-section h1 { color: var(--accent-red); margin: 0; }

        /* Order Sheet Styling */
        .order-sheet {
            background: #fff; border: 4px solid var(--primary-yellow);
            padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .form-group { margin-bottom: 12px; }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px; border: 2px solid #ccc;
            border-radius: 8px; box-sizing: border-box; font-size: 16px;
        }

        /* Error state */
        input.invalid, select.invalid { border-color: var(--error-red) !important; background-color: #fff0f0; }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn-confirm { flex: 2; background: #0044cc; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; background: #888; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-share { width: 100%; background: #25D366; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; display: none; }

        #tile-type-row { display: none; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="lang-container">
            <button style="background:#333; color:#fff" onclick="setLang('en')">English</button>
            <button style="background:#fff; color:#333" onclick="setLang('ml')">മലയാളം</button>
        </div>
        <div class="header-title-box">H4 TILE ADHESIVE</div>
    </header>

    <div class="container">
        <div class="hero-title-section">
            <h1 class="lang" data-en="H4 Tile Adhesive: Next-Gen Installation Science" data-ml="H4 ടൈൽ അഡ്ഹസീവ്: പുതിയ തലമുറയുടെ ടൈൽ ഇൻസ്റ്റാളേഷൻ സയൻസ്">
                H4 ടൈൽ അഡ്ഹസീവ്: പുതിയ തലമുറയുടെ ടൈൽ ഇൻസ്റ്റാളേഷൻ സയൻസ്
            </h1>
        </div>

        <div class="order-sheet">
            <h3 style="text-align:center; margin-bottom:20px;">ORDER SHEET</h3>
            
            <form id="orderForm" novalidate>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>പേര് (Name)*</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group full-width">
                        <label>വിലാസം (Address)*</label>
                        <input type="text" id="address" required>
                    </div>
                    <div class="form-group">
                        <label>City*</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>Land Mark*</label>
                        <input type="text" id="landmark" required>
                    </div>
                    <div class="form-group">
                        <label>മൊബൈൽ (10 Digits)*</label>
                        <input type="tel" id="mobile" pattern="[0-9]{10}" inputmode="numeric" required oninput="syncWA(this.value)">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp (Option)</label>
                        <input type="tel" id="whatsapp" pattern="[0-9]{10}" inputmode="numeric">
                    </div>
                    <div class="form-group">
                        <label>പിൻ‌കോഡ് (6 Digits)*</label>
                        <input type="tel" id="pincode" pattern="[0-9]{6}" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label>ജില്ല (District)*</label>
                        <input type="text" id="district" required>
                    </div>
                    <div class="form-group full-width">
                        <label>സംസ്ഥാനം (State)*</label>
                        <input type="text" id="state" value="Kerala" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Tile Adhesive ചെയ്യേണ്ട സ്ഥലം*</label>
                        <select id="place" onchange="showTileMenu()" required>
                            <option value="">തിരഞ്ഞെടുക്കുക</option>
                            <option value="Home">Home</option>
                            <option value="Office">Office</option>
                            <option value="Shop">Shop</option>
                            <option value="Building">Building</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group full-width" id="tile-type-row">
                        <label>ടൈൽ തരം തിരഞ്ഞെടുക്കുക*</label>
                        <select id="tile_type" required>
                            <option value="">തിരഞ്ഞെടുക്കുക</option>
                            <option value="Marble">Marble</option>
                            <option value="Granite">Granite</option>
                            <option value="Marbonite">Marbonite</option>
                            <option value="Floor">Floor</option>
                            <option value="Wall">Wall</option>
                            <option value="Bathroom">Bathroom</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Quantity (1 to 1,000,000)*</label>
                        <input type="number" id="qty" min="1" max="1000000" inputmode="numeric" required>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="button" class="btn-confirm" onclick="validateAndSend()">CONFIRM</button>
                    <button type="reset" class="btn-cancel" onclick="resetForm()">CANCEL</button>
                </div>
                
                <button type="button" id="shareBtn" class="btn-share" onclick="shareOrder()">SHARE ORDER DETAILS</button>
            </form>
        </div>
    </div>

    <script>
        function setLang(lang) {
            document.querySelectorAll('.lang').forEach(el => el.innerText = el.getAttribute('data-' + lang));
        }

        function syncWA(val) {
            if(val.length === 10) document.getElementById('whatsapp').value = val;
        }

        function showTileMenu() {
            const place = document.getElementById('place').value;
            document.getElementById('tile-type-row').style.display = place ? 'block' : 'none';
        }

        function resetForm() {
            document.getElementById('tile-type-row').style.display = 'none';
            document.getElementById('shareBtn').style.display = 'none';
            const fields = document.querySelectorAll('input, select');
            fields.forEach(f => f.classList.remove('invalid'));
        }

        function validateAndSend() {
            const form = document.getElementById('orderForm');
            const fields = form.querySelectorAll('input[required], select[required]');
            let valid = true;

            fields.forEach(f => {
                if(!f.value || !f.checkValidity()) {
                    f.classList.add('invalid');
                    valid = false;
                } else {
                    f.classList.remove('invalid');
                }
            });

            if(!valid) {
                alert("ദയവായി എല്ലാ വിവരങ്ങളും കൃത്യമായി നൽകുക (ചുവന്ന ബോക്സുകൾ ശ്രദ്ധിക്കുക).");
                return;
            }

            const data = {
                name: document.getElementById('name').value,
                addr: document.getElementById('address').value,
                city: document.getElementById('city').value,
                land: document.getElementById('landmark').value,
                mob: document.getElementById('mobile').value,
                wa: document.getElementById('whatsapp').value,
                pin: document.getElementById('pincode').value,
                dist: document.getElementById('district').value,
                loc: document.getElementById('place').value,
                tile: document.getElementById('tile_type').value,
                qty: document.getElementById('qty').value
            };

            const msg = `*NEW H4 ORDER*%0A*Name:* ${data.name}%0A*Address:* ${data.addr}%0A*City:* ${data.city}%0A*Landmark:* ${data.land}%0A*Phone:* ${data.mob}%0A*Pin:* ${data.pin}%0A*Work:* ${data.loc} (${data.tile})%0A*Qty:* ${data.qty} Bags`;

            // Message 1: To Admin
            window.open(`https://wa.me/919745838382?text=${msg}`, '_blank');

            // Message 2: To Customer
            if(data.wa) {
                setTimeout(() => {
                    window.open(`https://wa.me/91${data.wa}?text=Your H4 Order Confirmation:%0A${msg}`, '_blank');
                }, 1000);
            }

            document.getElementById('shareBtn').style.display = 'block';
        }

        function shareOrder() {
            const name = document.getElementById('name').value;
            const qty = document.getElementById('qty').value;
            const text = `H4 Tile Adhesive Order Request - Name: ${name}, Qty: ${qty} Bags.`;
            if (navigator.share) {
                navigator.share({ title: 'H4 Order', text: text, url: window.location.href });
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
            }
        }
    </script>
</body>
</html>
