<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4 Tile Adhesive - Technical Order Pro</title>
    <style>
        :root {
            --primary-yellow: #f1e311;
            --dark-blue: #1a2a44;
            --accent-red: #d32f2f;
            --border-width: 15px;
            --error-red: #ff3838;
        }

        body {
            font-family: 'Segoe UI', 'Meera', Tahoma, sans-serif;
            margin: 0; padding: 0; line-height: 1.8;
            background-color: #f4f4f4;
            border-left: var(--border-width) solid var(--primary-yellow);
            border-right: var(--border-width) solid var(--primary-yellow);
        }

        header {
            background: var(--primary-yellow);
            padding: 25px 15px;
            text-align: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .header-title-box {
            background: #000; color: var(--primary-yellow);
            display: inline-block; padding: 12px 35px;
            font-weight: bold; font-size: 1.5rem; border-radius: 4px;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; background: white; }

        /* Order Form Styling */
        .order-sheet {
            background: #fff; border: 4px solid var(--primary-yellow);
            padding: 25px; margin-top: 30px; border-radius: 15px;
        }

        .form-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }

        .full-width { grid-column: span 2; }

        label { font-weight: bold; margin-bottom: 5px; color: var(--dark-blue); }

        input, select {
            padding: 12px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 1rem; outline: none; transition: 0.3s;
        }

        input:focus { border-color: var(--dark-blue); }

        .invalid { border-color: var(--error-red) !important; background-color: #fff8f8; }

        .error-text { color: var(--error-red); font-size: 0.8rem; display: none; margin-top: 3px; }

        /* Buttons */
        .btn-container { display: flex; gap: 15px; margin-top: 25px; }

        .btn-confirm {
            flex: 2; background: var(--dark-blue); color: white;
            padding: 18px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; font-size: 1.1rem;
        }

        .btn-cancel {
            flex: 1; background: #888; color: white;
            padding: 18px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer;
        }

        .btn-share {
            background: #25D366; color: white; padding: 12px;
            border: none; border-radius: 8px; width: 100%;
            margin-top: 10px; font-weight: bold; display: none;
        }

        #sub-work-type { display: none; }

        @media (max-width: 600px) {
            .form-section { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-box">H4 TILE ADHESIVE</div>
    </header>

    <div class="container">
        <h2 style="text-align:center; color: var(--dark-blue);">ORDER FORM / ഓർഡർ ഷീറ്റ്</h2>

        <form id="h4OrderForm" class="order-sheet" novalidate>
            <div class="form-section">
                <div class="form-group full-width">
                    <label>പേര് / Name *</label>
                    <input type="text" id="name" required>
                    <span class="error-text">പേര് നിർബന്ധമാണ്</span>
                </div>

                <div class="form-group full-width">
                    <label>വിലാസം / Address *</label>
                    <input type="text" id="address" required>
                    <span class="error-text">വിലാസം നൽകുക</span>
                </div>

                <div class="form-group">
                    <label>City *</label>
                    <input type="text" id="city" required>
                </div>
                <div class="form-group">
                    <label>Landmark *</label>
                    <input type="text" id="landmark" required>
                </div>

                <div class="form-group">
                    <label>മൊബൈൽ / Mobile (10 Digit) *</label>
                    <input type="tel" id="mobile" pattern="[0-9]{10}" inputmode="numeric" required oninput="syncWhatsapp(this.value)">
                    <span class="error-text">10 അക്ക നമ്പർ നൽകുക</span>
                </div>

                <div class="form-group">
                    <label>WhatsApp (Optional)</label>
                    <input type="tel" id="whatsapp" pattern="[0-9]{10}" inputmode="numeric">
                    <span class="error-text">തെറ്റായ നമ്പർ</span>
                </div>

                <div class="form-group">
                    <label>Pincode (6 Digit) *</label>
                    <input type="tel" id="pincode" pattern="[0-9]{6}" inputmode="numeric" required>
                    <span class="error-text">6 അക്ക പിൻകോഡ് നൽകുക</span>
                </div>
                <div class="form-group">
                    <label>District / ജില്ല *</label>
                    <input type="text" id="district" required>
                </div>
                <div class="form-group full-width">
                    <label>State / സംസ്ഥാനം *</label>
                    <input type="text" id="state" value="Kerala" required>
                </div>

                <div class="form-group full-width">
                    <label>ടൈൽ അഡ്ഹസീവ് ചെയ്യേണ്ട സ്ഥലം *</label>
                    <select id="location_type" required onchange="toggleWorkType()">
                        <option value="">തിരഞ്ഞെടുക്കുക</option>
                        <option value="Home">Home (വീട്)</option>
                        <option value="Office">Office</option>
                        <option value="Shop">Shop</option>
                        <option value="Building">Building</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group full-width" id="sub-work-type">
                    <label>ഏത് തരം വർക്ക് ആണ്? *</label>
                    <select id="work_item" required>
                        <option value="">തിരഞ്ഞെടുക്കുക</option>
                        <option value="Marble">Marble</option>
                        <option value="Granite">Granite</option>
                        <option value="Marbonite">Marbonite</option>
                        <option value="Floor Tile">Floor Tile</option>
                        <option value="Wall Tile">Wall Tile</option>
                        <option value="Bathroom">Bathroom</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Quantity (1 to 1000000) *</label>
                    <input type="number" id="qty" min="1" max="1000000" inputmode="numeric" required>
                    <span class="error-text">അളവ് നൽകുക</span>
                </div>
            </div>

            <div class="btn-container">
                <button type="button" class="btn-confirm" onclick="validateAndSend()">CONFIRM ORDER</button>
                <button type="reset" class="btn-cancel">CANCEL</button>
            </div>
            
            <button type="button" id="shareBtn" class="btn-share" onclick="shareOrder()">SHARE ORDER DETAILS</button>
        </form>
    </div>

    <script>
        // Sync mobile to whatsapp automatically
        function syncWhatsapp(val) {
            if(val.length === 10) {
                document.getElementById('whatsapp').value = val;
            }
        }

        // Show sub-category when location is selected
        function toggleWorkType() {
            const loc = document.getElementById('location_type').value;
            const sub = document.getElementById('sub-work-type');
            sub.style.display = loc ? "flex" : "none";
        }

        function validateAndSend() {
            const form = document.getElementById('h4OrderForm');
            const inputs = form.querySelectorAll('input[required], select[required]');
            let isValid = true;

            inputs.forEach(input => {
                const error = input.nextElementSibling;
                // Basic empty check
                if (!input.value || !input.checkValidity()) {
                    input.classList.add('invalid');
                    if(error && error.classList.contains('error-text')) error.style.display = 'block';
                    isValid = false;
                } else {
                    input.classList.remove('invalid');
                    if(error && error.classList.contains('error-text')) error.style.display = 'none';
                }
            });

            if (isValid) {
                const data = {
                    name: document.getElementById('name').value,
                    address: document.getElementById('address').value,
                    location: document.getElementById('city').value + ", " + document.getElementById('district').value,
                    mobile: document.getElementById('mobile').value,
                    wa: document.getElementById('whatsapp').value,
                    work: document.getElementById('location_type').value + " - " + document.getElementById('work_item').value,
                    qty: document.getElementById('qty').value
                };

                const message = `*H4 TILE ADHESIVE - NEW ORDER*%0A---------------------------%0A*Name:* ${data.name}%0A*Address:* ${data.address}%0A*Place:* ${data.location}%0A*Phone:* ${data.mobile}%0A*Work:* ${data.work}%0A*Qty:* ${data.qty} Bags%0A---------------------------`;

                // 1. Send to Admin
                window.open(`https://wa.me/919745838382?text=${message}`, '_blank');

                // 2. Send to Customer (if whatsapp provided)
                if(data.wa.length === 10) {
                    setTimeout(() => {
                        window.open(`https://wa.me/91${data.wa}?text=Thank you for choosing H4. Your Order Details:%0A${message}`, '_blank');
                    }, 1000);
                }

                document.getElementById('shareBtn').style.display = 'block';
                alert("Order Details generated! Opening WhatsApp...");
            } else {
                alert("ദയവായി ചുവന്ന നിറത്തിലുള്ള ഭാഗങ്ങൾ ശരിയായി പൂരിപ്പിക്കുക.");
            }
        }

        function shareOrder() {
            const name = document.getElementById('name').value;
            const qty = document.getElementById('qty').value;
            if (navigator.share) {
                navigator.share({
                    title: 'H4 Order Details',
                    text: `H4 Tile Adhesive order for ${name} - ${qty} Bags.`,
                    url: window.location.href
                });
            } else {
                alert("Sharing not supported on this browser");
            }
        }
    </script>
</body>
</html>
