<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>H4 Coupon</title>
<meta name="theme-color" content="#8A5B00">

<!-- ============================================================
     H4 COUPON MODULE — standalone, offline-first.
     Independent from the H4 ERP (separate localStorage key,
     separate login/session) but built with matching structural
     conventions so the two can be linked together later.

     Load order matters:
       1. tokens.css / base.css / components.css
       2. js/db.js        (LocalStorage data layer)
       3. js/utils.js      (shared helpers)
       4. js/router.js     (hash router + nav shell)
       5. js/views/*.js     (each view self-registers)
       6. js/app.js         (boots the app last)
     ============================================================ -->

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div id="app"><!-- router injects topbar / view / bottomnav here --></div>
<div id="snackbar-host"></div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>

<script src="views/login.js"></script>
<script src="views/dashboard.js"></script>
<script src="views/scanner.js"></script>
<script src="views/verify.js"></script>
<script src="views/customers.js"></script>
<script src="views/points.js"></script>
<script src="views/rewards.js"></script>
<script src="views/history.js"></script>
<script src="views/settings.js"></script>
<script src="views/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
